version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    groups:
      flutter:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # eslint-config-next supports eslint 9 only; eslint 10 and @eslint/js 10
      # break `npm ci` (peer conflict) and the lint run.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint pins typescript < 6.1; a TS major bump breaks lint.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: monthly
