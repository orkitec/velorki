name: gazetteer-perf

# app/test/perf/gazetteer_perf_test.dart against a real, city-sized gazetteer:
# New York's W75_N40.gaz, 89 MB, which is what a rider actually types into.
# The committed fixtures are 0.3 and 1.5 MB and would never show a query that
# stopped using its index, so this job downloads the tile from the mirror
# instead of committing one.
#
# Nightly rather than per-push: the download is most of the run, and the
# ceilings in the test are deliberately generous, so this is a tripwire for a
# regression, not a benchmark to watch per commit. The numbers it measured go
# into the run's summary either way.
#
# The tile comes out of whatever snapshot latest.json currently points at, so
# the job follows the mirror instead of pinning a tag that goes stale.

on:
  workflow_dispatch:
  schedule:
    # 05:41 UTC, an hour after the iOS run and clear of the nightly emulator.
    - cron: "41 5 * * *"

# Reads the repository and the public mirror; writes nothing.
permissions:
  contents: read

env:
  PERF_TILE: W75_N40
  MIRROR_LATEST: https://raw.githubusercontent.com/orkitec/velorki-data/main/latest.json

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep in sync with mise.toml and app/.fvmrc
          cache: true

      - name: Prepare the app package
        working-directory: app
        run: |
          flutter pub get
          bash tool/gen.sh

      # The mirror is sharded across several releases; the pointer lists
      # every shard's base URL, and the tile is in one of them.
      - name: Resolve the current mirror snapshot
        id: snapshot
        run: |
          set -euo pipefail
          pointer=$(curl --retry 3 --retry-all-errors --fail --location --silent --show-error \
            --user-agent "velorki-ci (+https://github.com/orkitec/velorki)" "$MIRROR_LATEST")
          tag=$(printf '%s' "$pointer" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')
          bases=$(printf '%s' "$pointer" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          urls = [s["baseUrl"] for s in d.get("shards", []) if s.get("baseUrl")]
          if d.get("baseUrl") and d["baseUrl"] not in urls:
              urls.insert(0, d["baseUrl"])
          print(" ".join(urls))')
          generated=$(printf '%s' "$pointer" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("generatedAt", ""))')
          {
            echo "tag=$tag"
            echo "bases=$bases"
            echo "generated=$generated"
          } >> "$GITHUB_OUTPUT"
          echo "Gazetteer snapshot: $tag" >> "$GITHUB_STEP_SUMMARY"

      # The tiles are published first and the gazetteers after them, which
      # takes hours: a snapshot younger than 36 h without its gazetteer is
      # one still being published, and the measurement waits for the next
      # night with a warning. An older one without it fails the run.
      - name: Download the New York gazetteer
        id: download
        env:
          GENERATED: ${{ steps.snapshot.outputs.generated }}
        run: |
          set -euo pipefail
          found=""
          for base in ${{ steps.snapshot.outputs.bases }}; do
            if curl --retry 3 --retry-all-errors --fail --location --silent --show-error \
              --user-agent "velorki-ci (+https://github.com/orkitec/velorki)" \
              --output "$RUNNER_TEMP/$PERF_TILE.gaz" "${base}$PERF_TILE.gaz"; then
              found="$base"
              break
            fi
          done
          if [ -z "$found" ]; then
            age=$(( $(date -u +%s) - $(date -u -d "${GENERATED:-1970-01-01T00:00:00Z}" +%s) ))
            if [ "$age" -lt $(( 36 * 3600 )) ]; then
              echo "::warning::$PERF_TILE.gaz is not in the snapshot published $GENERATED yet (its gazetteers are still being built); no measurement tonight"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::$PERF_TILE.gaz is in no shard of the mirror, $(( age / 3600 )) h after the snapshot was published"
            exit 1
          fi
          echo "Shard: $found" >> "$GITHUB_STEP_SUMMARY"
          ls -l "$RUNNER_TEMP/$PERF_TILE.gaz"

      - name: Measure
        if: ${{ steps.download.outputs.skip != 'true' }}
        working-directory: app
        run: |
          set -euo pipefail
          flutter test test/perf/gazetteer_perf_test.dart \
            --dart-define=GAZETTEER_PERF_FILE="$RUNNER_TEMP/$PERF_TILE.gaz" \
            | tee "$RUNNER_TEMP/perf.log"
          # The test prints one "GAZPERF | what | how long" line per
          # measurement; lift them into the run summary as a table.
          {
            echo "| measurement | $PERF_TILE |"
            echo "| --- | --- |"
            sed -n 's/^GAZPERF //p' "$RUNNER_TEMP/perf.log" | sed 's/$/ |/'
          } >> "$GITHUB_STEP_SUMMARY"
