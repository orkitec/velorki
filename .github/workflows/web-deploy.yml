name: web deploy

# A push to `production` → the checks → `orkify deploy upload` → the VPS.
#
# `main` is the trunk; a release is main merged into `production`. So every
# commit that reaches this branch is meant to go live, and the job runs the
# whole `web.yml` gate again before it uploads anything: a release is never
# published on the strength of a check that ran on a different tree.
#
# There is no SSH here. `orkify deploy upload` POSTs the release to Orkify's
# API with its sha256, size and git metadata; the API key decides which project
# and which box it belongs to, and the agent on the box picks the deploy up on
# its next poll, unpacks it, runs `deploy.install` and `deploy.build` from
# `web/orkify.yml` and rolling-reloads the cluster. CI therefore needs no
# deploy user, no host key and no inbound access of any kind — one secret.
# docs/DEPLOY_WEB.md step 7 is the runbook.
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  # Nothing here writes to the repository.
  contents: read

concurrency:
  # One release at a time, and never cancel one half-way through: the upload
  # hands off to an agent that is already unpacking.
  group: web-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  # The Plus prices for the website, fresh from the stores' APIs with the keys
  # the release already uses (web/scripts/prices-stores.mjs). It never fails:
  # on a missing secret or a refused key it says why and writes nothing, and
  # the deploy below builds with the committed web/src/site/prices.json.
  prices:
    runs-on: ubuntu-latest
    # Where ASC_* and PLAY_SERVICE_ACCOUNT_JSON live. Its required reviewer
    # gates this job; the deploy goes on without it if the job is rejected.
    environment: release
    permissions:
      contents: read
    outputs:
      written: ${{ steps.fetch.outputs.written }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # Node built-ins only: no npm ci.
      - id: fetch
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/prices-stores.mjs
      - if: ${{ steps.fetch.outputs.written == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prices
          path: web/src/site/prices.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: prices
    # Also when `prices` failed or was rejected: the committed prices are good
    # enough to deploy with. Not when the run was cancelled.
    if: ${{ !cancelled() }}
    # Holds ORKIFY_API_KEY as an environment secret, so nothing outside this
    # workflow's environment can read it, and the maintainer can put a required
    # reviewer or a branch restriction on it without touching the workflow.
    environment: web-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The whole history: build-info dates each content file by its last
          # commit, for the sitemap's lastmod.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The VPS runs Node 22 LTS; build on what production runs.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Also installs @orkify/cli, a devDependency pinned by the lockfile, so
      # the deploy step needs no global install and no unpinned `npx` download.
      - run: npm ci

      # Fresh prices replace the committed ones in what is built and uploaded.
      - if: ${{ needs.prices.outputs.written == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prices
          path: web/src/site

      # The artifact has no `.git` - `orkify deploy upload` excludes it - so the
      # commit this release was built from has to travel inside the tarball.
      # This writes web/build-info.json from GITHUB_SHA; next.config.ts reads it
      # during the build on the box and inlines it for the footer. Before the
      # build below, so CI's build exercises the same path.
      - run: npm run build-info

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run locales -- --check
      - run: npm run build
      # Inspects the traced standalone tree, i.e. what is deployed, so it must
      # run after the build. Before it, .next/standalone does not exist and the
      # check fails on every fresh runner.
      - run: npm run check:deps

      - name: Upload the release to Orkify
        env:
          ORKIFY_API_KEY: ${{ secrets.ORKIFY_API_KEY }}
        # The CLI reads ORKIFY_API_KEY from the environment: the key is never
        # an argument, never echoed, and never written to a file. It makes its
        # own tarball from this directory and POSTs it with the sha256; the box
        # is whatever the key points at.
        run: npx orkify deploy upload .
