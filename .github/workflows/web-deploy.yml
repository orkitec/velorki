name: web deploy

# A push to `production` → the checks → `orkify deploy upload` → the VPS.
#
# `main` is the trunk; a release is main merged into `production`. So every
# commit that reaches this branch is meant to go live, and the job runs the
# whole `web.yml` gate again before it uploads anything: a release is never
# published on the strength of a check that ran on a different tree.
#
# There is no SSH here. `orkify deploy upload` POSTs the release to Orkify's
# API with its sha256, size and git metadata; the API key decides which project
# and which box it belongs to, and the agent on the box picks the deploy up on
# its next poll, unpacks it, runs `deploy.install` and `deploy.build` from
# `web/orkify.yml` and rolling-reloads the cluster. CI therefore needs no
# deploy user, no host key and no inbound access of any kind — one secret.
# docs/DEPLOY_WEB.md step 7 is the runbook.
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  # Nothing here writes to the repository.
  contents: read

concurrency:
  # One release at a time, and never cancel one half-way through: the upload
  # hands off to an agent that is already unpacking.
  group: web-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: web

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Holds ORKIFY_API_KEY as an environment secret, so nothing outside this
    # workflow's environment can read it, and the maintainer can put a required
    # reviewer or a branch restriction on it without touching the workflow.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The VPS runs Node 22 LTS; build on what production runs.
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Also installs @orkify/cli, a devDependency pinned by the lockfile, so
      # the deploy step needs no global install and no unpinned `npx` download.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run locales -- --check
      - run: npm run build
      # Inspects the traced standalone tree, i.e. what is deployed, so it must
      # run after the build. Before it, .next/standalone does not exist and the
      # check fails on every fresh runner.
      - run: npm run check:deps

      - name: Upload the release to Orkify
        env:
          ORKIFY_API_KEY: ${{ secrets.ORKIFY_API_KEY }}
        # The CLI reads ORKIFY_API_KEY from the environment: the key is never
        # an argument, never echoed, and never written to a file. It makes its
        # own tarball from this directory and POSTs it with the sha256; the box
        # is whatever the key points at.
        run: npx orkify deploy upload .
