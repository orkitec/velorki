name: ios (manual)

# iOS builds normally happen on the maintainer's Mac with fastlane, because
# macOS runners cost ten times Linux minutes. This manual workflow exists for
# release candidates when no Mac is at hand. It produces an unsigned archive
# unless the signing secrets are configured.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Xcode the app is built with (the Mac's too). The xcode-27 image
      # also carries betas, whose builds the App Store refuses: name the
      # release; 27.1 once its RC or final is on the image (iPhone Duo's
      # whole inner screen needs the 27.1 SDK).
      - name: Select Xcode
        env:
          XCODE_VERSION: "27.0"
        run: |
          xcode="/Applications/Xcode_${XCODE_VERSION}.app"
          [ -d "$xcode" ] || { echo "::error::no $xcode on the runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep in sync with mise.toml and app/.fvmrc
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter build ios --release --no-codesign --dart-define-from-file=env/ci.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velorki-ios-unsigned
          path: app/build/ios/iphoneos
          retention-days: 7
