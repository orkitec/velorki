name: integration ios

# The same emulator flows as integration.yml, on an iOS simulator, and on the
# same triggers: every push to main that touches the app, the tiles or the
# fixtures, plus the nightly run as the safety net for what a path filter
# cannot see. macOS runners are free for a public repository, so a push is
# worth one — but they queue slowly, so a newer push cancels the older
# simulator run rather than waiting behind it. Scheduled runs are their own
# concurrency group and are never cancelled. The tests fake the GPS and the
# permissions in-process, so nothing here depends on the simulator's own
# location; the map, the on-device router and the recorder are real.
#
# Split three ways, like the Android run (VELORKI_ITEST_SHARD, see
# app/tool/itest.sh). Three and no more: a public repository gets five
# concurrent macOS runners, and the nightly and a push can overlap. What makes
# a shard slow is the Xcode build every file pays for, so the pods and the
# derived data are cached — the derived data weekly, because a stale Xcode
# cache is worth less than a clean build and reuse beyond a week is thin.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/brouter-oracle/tiles/**"
      - "tools/gazetteer/fixtures/**"
      - ".github/workflows/integration-ios.yml"
  schedule:
    # 04:41 UTC, an hour after the Android run.
    - cron: "41 4 * * *"

concurrency:
  group: integration-ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  ORACLE_TILE: W20_N30
  RD5_FORMAT_VERSION: "11.2"
  FLUTTER_VERSION: "3.47.4"  # keep in sync with mise.toml and app/.fvmrc

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]

    steps:
      - uses: actions/checkout@v7

      # flutter-action's cache: true already covers the SDK and ~/.pub-cache.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Week stamp
        # Derived data is keyed on the ISO week, so it is rebuilt from nothing
        # once a week and reused inside it.
        id: stamp
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: CocoaPods cache
        uses: actions/cache@v4
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: pods-

      # Restored by every shard, stored by one: three uploads of the same
      # multi-gigabyte derived data would cost more than they save.
      - name: Restore the Xcode derived data
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            derived-${{ env.FLUTTER_VERSION }}-${{
            hashFiles('app/ios/Podfile.lock') }}-${{ steps.stamp.outputs.week }}
          restore-keys: |
            derived-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/ios/Podfile.lock') }}-

      - name: Prepare the app package
        working-directory: app
        run: |
          flutter pub get
          dart run build_runner build
          flutter gen-l10n

      - name: Build and serve the segments mirror
        run: bash app/tool/itest_mirror.sh

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          # The newest available iPhone runtime; the list is sorted by the
          # simulator tool, so the last iPhone line is the newest device.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime
                    for d in ds if d["name"].startswith("iPhone") and d["isAvailable"]]
          print(phones[-1]["udid"])
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted

      - name: Run the simulator suite
        working-directory: app
        env:
          VELORKI_ITEST_DEVICE: ${{ steps.sim.outputs.udid }}
          VELORKI_ITEST_REGION: madeira
          VELORKI_SEGMENTS_URL: http://127.0.0.1:8000
          VELORKI_ITEST_SHARD: ${{ matrix.shard }}
        run: tool/itest.sh

      # After the run, which is what fills it, and even on a red one.
      - name: Save the Xcode derived data
        if: always() && matrix.shard == '1/3'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            derived-${{ env.FLUTTER_VERSION }}-${{
            hashFiles('app/ios/Podfile.lock') }}-${{ steps.stamp.outputs.week }}

      - name: Mirror log
        if: always()
        run: cat mirror.log || true
