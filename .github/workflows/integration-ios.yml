name: integration ios

# The same emulator flows as integration.yml, on an iOS simulator, and on the
# same triggers: every push to main that touches the app, the tiles or the
# fixtures, plus the nightly run as the safety net for what a path filter
# cannot see. macOS runners are free for a public repository, so a push is
# worth one — but they queue slowly, so a newer push cancels the older
# simulator run rather than waiting behind it. Scheduled runs are their own
# concurrency group and are never cancelled. The tests fake the GPS and the
# permissions in-process, so nothing here depends on the simulator's own
# location; the map, the on-device router and the recorder are real.
#
# One job, not the three shards the Android run uses. What costs time here is
# not the tests: it is the Xcode build and the simulator boot, and
# app/tool/itest.sh pays both once per entry point, so nine files meant nine
# builds on every shard and 15–36 minutes each. VELORKI_ITEST_COMBINED=1 runs
# integration_test/all_tests.dart instead — every file imported and grouped
# into one process — so the build and the boot happen once for the whole
# suite. Sharding that would only buy the builds back.
#
# Android keeps its shards (three shards x three API levels): re-installing on
# an emulator is cheap, the matrix is there to cover the API levels anyway, and
# a file per process is the stronger isolation — a leaked route or a recording
# left running takes down one file rather than the run. Every test therefore
# has to work both ways; integration_test/all_tests.dart says what that costs.
#
# The pods and the derived data are still cached, now one restore and one save,
# and the derived data weekly, because a stale Xcode cache is worth less than a
# clean build and reuse beyond a week is thin.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/brouter-oracle/tiles/**"
      - "tools/gazetteer/fixtures/**"
      - ".github/workflows/integration-ios.yml"
  schedule:
    # 04:41 UTC, an hour after the Android run.
    - cron: "41 4 * * *"

# Reads the repository and writes nothing back to it.
permissions:
  contents: read

concurrency:
  group: integration-ios-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  ORACLE_TILE: W20_N30
  RD5_FORMAT_VERSION: "11.2"
  FLUTTER_VERSION: "3.47.4"  # keep in sync with mise.toml and app/.fvmrc

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # flutter-action's cache: true already covers the SDK and ~/.pub-cache.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Week stamp
        # Derived data is keyed on the ISO week, so it is rebuilt from nothing
        # once a week and reused inside it.
        id: stamp
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: CocoaPods cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: pods-

      # Restored here and saved after the run, which is what fills it. One job
      # now, so this is a plain restore/save pair rather than the "every shard
      # restores, one shard saves" dance the Android workflow still needs.
      - name: Restore the Xcode derived data
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            derived-${{ env.FLUTTER_VERSION }}-${{
            hashFiles('app/ios/Podfile.lock') }}-${{ steps.stamp.outputs.week }}
          restore-keys: |
            derived-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/ios/Podfile.lock') }}-

      - name: Prepare the app package
        working-directory: app
        run: |
          flutter pub get
          dart run build_runner build
          flutter gen-l10n

      - name: Build and serve the segments mirror
        run: bash app/tool/itest_mirror.sh

      - name: Boot a simulator
        id: sim
        run: |
          set -euo pipefail
          # The newest available iPhone runtime; the list is sorted by the
          # simulator tool, so the last iPhone line is the newest device.
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime
                    for d in ds if d["name"].startswith("iPhone") and d["isAvailable"]]
          print(phones[-1]["udid"])
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices booted

      - name: Run the simulator suite
        working-directory: app
        env:
          VELORKI_ITEST_DEVICE: ${{ steps.sim.outputs.udid }}
          VELORKI_ITEST_REGION: madeira
          VELORKI_SEGMENTS_URL: http://127.0.0.1:8000
          # One build, one attach, all nine files in one process.
          VELORKI_ITEST_COMBINED: "1"
          # The watchdog in tool/itest.sh guards one `flutter test` call, which
          # is now the whole suite: 900 s would kill a healthy run.
          VELORKI_ITEST_TIMEOUT: "2400"
        run: tool/itest.sh

      # After the run, which is what fills it, and even on a red one.
      - name: Save the Xcode derived data
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            derived-${{ env.FLUTTER_VERSION }}-${{
            hashFiles('app/ios/Podfile.lock') }}-${{ steps.stamp.outputs.week }}

      - name: Mirror log
        if: always()
        run: cat mirror.log || true
