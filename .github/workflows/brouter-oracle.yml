name: brouter-oracle

# Track R0: keep the BRouter test oracle honest.
#
# Downloads the pinned BRouter 1.7.10 release and the two rd5 tiles the corpus
# was recorded against, starts the RouteServer and replays corpus/index.json.
#
# The tiles come from the immutable snapshot release oracle-20260912 in
# orkitec/velorki-data, not from brouter.de (which rebuilds segments4 nightly and
# so can never serve the recorded bytes). A checksum mismatch is therefore a real
# problem now, not the expected nightly drift, and this job fails on it.

on:
  workflow_dispatch:
  schedule:
    # Sundays 04:17 UTC. The tiles are pinned, so the schedule only guards
    # against drift in the port, the profiles and the upstream jar.
    - cron: "17 4 * * 0"

defaults:
  run:
    working-directory: tools/brouter-oracle

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache the pinned BRouter oracle tiles
        uses: actions/cache@v4
        with:
          path: tools/brouter-oracle/.cache/segments4
          key: brouter-oracle-tiles-${{ hashFiles('tools/brouter-oracle/tiles.sha256') }}

      - name: Fetch the pinned BRouter release and the rd5 tiles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Any non-zero exit is fatal. Exit 3 used to mean "brouter.de rebuilt the
        # segments, skip"; with the tiles pinned to an immutable release it means
        # the release assets were replaced or tiles.sha256 was edited without
        # re-recording, and both need a human.
        run: ./fetch.sh

      - name: Start the RouteServer
        run: ./serve.sh

      - name: Replay the corpus
        id: check
        run: python3 check_corpus.py --out .cache/check-diff.txt --bodies

      - name: Stop the RouteServer
        if: always()
        run: ./stop.sh || true

      - name: Upload the diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brouter-oracle-diff
          if-no-files-found: ignore
          retention-days: 30
          path: |
            tools/brouter-oracle/.cache/check-diff.txt
            tools/brouter-oracle/.cache/check-bodies/
            tools/brouter-oracle/.cache/routeserver.log
            tools/brouter-oracle/.cache/routeserver.cmdline
