name: brouter-oracle

# Track R0: keep the BRouter test oracle honest.
#
# Downloads the pinned BRouter 1.7.10 release, stages the two rd5 tiles the
# corpus was recorded against, starts the RouteServer and replays
# corpus/index.json.
#
# The tiles are committed in tools/brouter-oracle/tiles/ and fetch.sh only
# copies and verifies them -- nothing comes from brouter.de, which rebuilds
# segments4 nightly and so can never serve the recorded bytes. A checksum
# mismatch is therefore a real problem, not the expected nightly drift, and this
# job fails on it.

on:
  workflow_dispatch:
  schedule:
    # Sundays 04:17 UTC. The tiles are pinned, so the schedule only guards
    # against drift in the port, the profiles and the upstream jar.
    - cron: "17 4 * * 0"

defaults:
  run:
    working-directory: tools/brouter-oracle

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch the pinned BRouter release and stage the rd5 tiles
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Any non-zero exit is fatal. Exit 3 used to mean "brouter.de rebuilt the
        # segments, skip"; with the tiles committed it means a fixture in
        # tools/brouter-oracle/tiles/ no longer matches tiles.sha256, which needs
        # a human.
        run: ./fetch.sh

      - name: Start the RouteServer
        run: ./serve.sh

      - name: Replay the corpus
        id: check
        run: python3 check_corpus.py --out .cache/check-diff.txt --bodies

      - name: Stop the RouteServer
        if: always()
        run: ./stop.sh || true

      - name: Upload the diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brouter-oracle-diff
          if-no-files-found: ignore
          retention-days: 30
          path: |
            tools/brouter-oracle/.cache/check-diff.txt
            tools/brouter-oracle/.cache/check-bodies/
            tools/brouter-oracle/.cache/routeserver.log
            tools/brouter-oracle/.cache/routeserver.cmdline
