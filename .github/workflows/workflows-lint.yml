name: workflows-lint

# actionlint over every workflow, with shellcheck on the `run:` blocks at
# warning level (its info notes do not fail the job). The binary is the pinned
# release, checked against its sha256: no third-party action.

on:
  push:
    paths: [".github/workflows/**"]
  pull_request:
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_OPTS: --severity=warning
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
          # Without shellcheck on the PATH actionlint silently skips the scripts.
          command -v shellcheck || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          "$RUNNER_TEMP/actionlint" -color
