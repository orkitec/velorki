name: glstrings push sources

# Pushes the English source strings to GL Strings (Applanga) whenever they
# change on main. Needs the APPLANGA_ACCESS_TOKEN secret; without it the job
# is skipped rather than shown green for doing nothing (the CLI exits 0 on a
# missing token).
on:
  push:
    branches: [main]
    paths: ["app/lib/l10n/app_en.arb"]
  workflow_dispatch:

jobs:
  token:
    if: ${{ github.repository_owner == 'orkitec' }}
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          APPLANGA_ACCESS_TOKEN: ${{ secrets.APPLANGA_ACCESS_TOKEN }}
        run: |
          if [ -n "$APPLANGA_ACCESS_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLANGA_ACCESS_TOKEN is not set; nothing is pushed to GL Strings."
          fi

  push:
    needs: token
    if: ${{ needs.token.outputs.present == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: applanga/setup-applanga-cli@v1.0.3
        with:
          version: 1.0.*
      - name: Push sources
        env:
          APPLANGA_ACCESS_TOKEN: ${{ secrets.APPLANGA_ACCESS_TOKEN }}
        run: applanga push --force
