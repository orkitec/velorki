name: integration

# The emulator suite under app/integration_test/: the feature flows that only
# mean something on a real device — the planner against the on-device routing
# engine, the Loop sheet, saving into the library, recording a ride, the map
# style reload and a GPX import.
#
# Runs on every push to main that can change what the suite exercises — the
# app package, the committed rd5 tile, the .gaz fixtures served beside it, or
# this file — and again nightly as the safety net for everything a path filter
# cannot see (a runner image change, a flaky boot, an Android API level). One
# run boots an emulator, installs a test build per file and routes for real,
# which is minutes, not seconds, so pushes to the same branch cancel each
# other: only the newest commit is worth an emulator. Scheduled runs are their
# own concurrency group and are never cancelled. The per-push app workflow
# keeps running the widget and unit tests.
#
# The suite is split three ways (VELORKI_ITEST_SHARD, see app/tool/itest.sh),
# so the matrix is api-level x shard and the GitHub UI shows `emulator (34,
# 1/3)`. Two things are cached to keep a shard from paying the same startup
# three times: the Gradle caches, which the first test build otherwise fills
# from scratch, and a booted AVD snapshot, which is created once per API level
# in its own step and restored by every shard afterwards. On a cold cache all
# three shards of an API level create the AVD and only the first one to finish
# stores it; the others log a harmless "cache already exists" and the next run
# is fast for all of them.
#
# The tile is the same committed rd5 fixture the BRouter parity corpus was
# recorded against (tools/brouter-oracle/tiles/), so the routes this suite plans
# are reproducible and nothing is downloaded. It is served to the emulator from
# a plain HTTP server on the runner; 10.0.2.2 is the host as the emulator sees
# it. Because the tile is Madeira, the suite runs with
# VELORKI_ITEST_REGION=madeira, which swaps the New York coordinates the local
# runs use for Funchal ones and points the virtual GPS at the same place.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/brouter-oracle/tiles/**"
      - "tools/gazetteer/fixtures/**"
      - ".github/workflows/integration.yml"
  schedule:
    # 03:41 UTC, before the brouter-oracle job and well clear of the push CI.
    - cron: "41 3 * * *"

# Reads the repository and writes nothing back to it.
permissions:
  contents: read

concurrency:
  # The event name is in the group so a push never cancels the nightly and the
  # nightly never cancels a push; cancel-in-progress is gated on push as well,
  # so two scheduled runs would queue rather than kill each other.
  group: integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # The one tile the suite needs: Madeira, lon -20..-15, lat 30..35. It is
  # committed at tools/brouter-oracle/tiles/$ORACLE_TILE.rd5.
  ORACLE_TILE: W20_N30
  # rd5 format version the mirror advertises, as brouter/updater/sync.sh does.
  RD5_FORMAT_VERSION: "11.2"

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Android 12 is the oldest phone in the house (a Pixel 3 XL), 15
        # enforces edge-to-edge and the foreground-service rules, 16 is the
        # newest with a runner image; the app compiles against 37.
        api-level: [31, 35, 36]
        # Keep api-level first: the job name the UI renders is the matrix
        # values in this order, i.e. `emulator (34, 1/3)`.
        shard: ["1/3", "2/3", "3/3"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The emulator is unusably slow without hardware acceleration, and the
      # hosted runner needs the device node opened up by hand.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # flutter-action's own cache: true covers the SDK and ~/.pub-cache;
      # the Gradle caches below are the Android half it does not touch.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep in sync with mise.toml and app/.fvmrc
          cache: true

      # Restored by every shard, stored by one of them: the caches are
      # identical, and three uploads of the same half-gigabyte buy nothing.
      - name: Restore the Gradle caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            gradle-itest-${{ matrix.api-level }}-${{
            hashFiles('app/android/**/*.gradle*', 'app/pubspec.lock') }}
          restore-keys: |
            gradle-itest-${{ matrix.api-level }}-

      - name: Prepare the app package
        working-directory: app
        run: |
          flutter pub get
          dart run build_runner build
          flutter gen-l10n

      # The emulator action installs the system image itself, once, with no
      # check: a download that arrived broken ("Error on ZipFile unknown
      # archive") left it with no image, the emulator never came up and the
      # shard died on the action's own `adb emu kill`. So the image is
      # installed here first, verified by the file the emulator boots from,
      # and fetched again on a bad archive; the action then finds it in place
      # and downloads nothing. The image's revision comes out of its
      # package.xml for the AVD cache key below.
      - name: Install the system image
        id: sysimg
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          pkg="system-images;android-${{ matrix.api-level }};google_apis;x86_64"
          dir="$sdk/system-images/android-${{ matrix.api-level }}/google_apis/x86_64"
          for try in 1 2 3; do
            # sdkmanager reports a bad archive as a warning and exits 0, so
            # the file it should have produced is the check, not its status.
            printf 'y\n%.0s' {1..30} \
              | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "$pkg" || true
            if [ -s "$dir/system.img" ] && [ -f "$dir/package.xml" ]; then
              revision=$(sed -n 's/.*<major>\([0-9]*\)<\/major>.*/\1/p' "$dir/package.xml" | head -n 1)
              echo "revision=${revision:-0}" >> "$GITHUB_OUTPUT"
              echo "==> $pkg r${revision:-0} in place"
              exit 0
            fi
            echo "==> $pkg did not install cleanly (try $try of 3); fetching it again"
            rm -rf "$dir" "$sdk/.temp"
            sleep 20
          done
          echo "::error::$pkg could not be installed"
          exit 1

      # Keyed by the image's revision too, so a new image never meets an AVD
      # and a snapshot made on the old one: those would fail to load and
      # cold-boot every shard until the key was changed by hand. (The
      # "Failed to load snapshot 'default_boot'" in a create step's log is
      # the cold boot on a cache miss, before the snapshot exists: expected.)
      - name: AVD cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-x86_64-google_apis-pixel_6-r${{ steps.sysimg.outputs.revision }}

      # Only on a miss, and only to write the snapshot the run below boots
      # from: no test is installed here, so -no-snapshot-save is absent on
      # purpose and the animations are left alone (the real run disables them).
      - name: Create the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: >-
            -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
            -camera-back none -camera-front none
          disable-animations: false
          script: echo "AVD snapshot written."

      - name: Build and serve the segments mirror
        run: bash app/tool/itest_mirror.sh

      - name: Run the emulator suite
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: app
          force-avd-creation: false
          emulator-options: >-
            -no-window -no-snapshot-save -no-audio -no-boot-anim
            -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb wait-for-device
            # Madeira, where the frozen oracle tile is. The tests read the same
            # place from VELORKI_ITEST_REGION.
            adb emu geo fix -16.92 32.65
            adb shell settings put secure location_mode 3
            # One line: the emulator action runs the script line by line, so
            # a backslash continuation is handed to sh as a command.
            VELORKI_ITEST_REGION=madeira VELORKI_SEGMENTS_URL=http://10.0.2.2:8000 VELORKI_ITEST_SHARD=${{ matrix.shard }} tool/itest.sh

      # After the run, because that is what fills them, and even on a red run:
      # a failing test is no reason to rebuild Gradle from nothing next time.
      - name: Save the Gradle caches
        if: always() && matrix.shard == '1/3'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            gradle-itest-${{ matrix.api-level }}-${{
            hashFiles('app/android/**/*.gradle*', 'app/pubspec.lock') }}

      - name: Mirror log
        if: always()
        run: cat mirror.log || true
