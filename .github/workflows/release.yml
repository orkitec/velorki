name: release

# Tag `vX.Y.Z` → signed Android AAB + APK, GitHub Release, Play internal track.
# Every publishing step is skipped when the secrets are absent, so forks get a
# green run that just builds an unsigned debug APK.
on:
  push:
    tags: ["v*"]

defaults:
  run:
    working-directory: app

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: app/pubspec.yaml
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter test

      - name: Restore signing and config from secrets
        if: ${{ env.HAVE_SECRETS == 'true' }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_ENV_PROD_JSON: ${{ secrets.APP_ENV_PROD_JSON }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<KP
          storeFile=upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          KP
          echo "$APP_ENV_PROD_JSON" > env/prod.json

      - name: Build release (signed)
        if: ${{ env.HAVE_SECRETS == 'true' }}
        run: |
          flutter build appbundle --release --dart-define-from-file=env/prod.json --build-number=${{ github.run_number }}
          flutter build apk --release --dart-define-from-file=env/prod.json --build-number=${{ github.run_number }}

      - name: Build debug (no secrets)
        if: ${{ env.HAVE_SECRETS != 'true' }}
        run: flutter build apk --debug --dart-define-from-file=env/ci.json

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Play internal testing
        if: ${{ env.HAVE_SECRETS == 'true' && env.HAVE_PLAY == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.orkitec.velorki
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
    env:
      HAVE_SECRETS: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && 'true' || 'false' }}
      HAVE_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && 'true' || 'false' }}
