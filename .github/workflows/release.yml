# Tag `vX.Y.Z` → Android (signed AAB + APK, GitHub Release, Play internal track)
# and iOS (signed build → TestFlight), both with the same version name and
# build number, computed once by the `version` job. A tag with a suffix
# (`v1.0.1-rc1`) is a trial: it reaches Play and TestFlight but makes no GitHub
# Release. The .ipa is never attached: it is signed for the App Store and
# installs nowhere else.
#
# An existing tag can be released again from GitHub alone: *Run workflow* on
# `main` with the tag (`gh workflow run release.yml --ref main -f tag=v1.2.3`).
# The run uses this file from `main` but builds the tag's code. `platforms`
# picks one store, `build_number` reuses the number the other store already
# has, and `dry_run` builds and signs everything but uploads nothing. Each
# platform job is idempotent: if its store already has the build number, it
# reports that and uploads nothing; the GitHub Release is only made if it does
# not exist yet.
#
# Two gates: the `version` job fails unless whoever started the run (the tag
# pusher, the dispatcher, or whoever re-runs it) is listed in the repository
# variable RELEASE_ACTORS (comma-separated logins), and both platform jobs run
# in the `release` environment, which has the maintainer as a required
# reviewer: nothing is signed or uploaded until the run is approved in the
# Actions UI. Without the secrets (a fork, or before the setup in
# app/fastlane/README.md and docs/RELEASE_IOS.md) every publishing step is
# skipped and the run finishes green with an unsigned debug APK and an unsigned
# iOS build.
#
# iOS signing is Xcode's automatic signing, authenticated with an App Store
# Connect API key instead of an Xcode account, in two steps:
#
#   1. Archive. `xcodebuild archive` signs with an Apple Development identity
#      whose private key must be in a keychain; Apple keeps no copy of it, so
#      the identity comes from a secret (.p12). Xcode fetches the development
#      profiles for the four targets with the API key. The archive cannot be
#      left unsigned: the export takes each target's entitlements (App Groups,
#      HealthKit, push) from the archive's signature.
#   2. Export. `xcodebuild -exportArchive` re-signs with Apple's cloud-managed
#      distribution certificate and the App Store profiles, and uploads to App
#      Store Connect. Nothing is submitted for review.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.0.2 (its code is built; this file comes from the branch the run is started on)"
        required: true
        type: string
      platforms:
        description: "Stores to release to"
        type: choice
        options: [both, android, ios]
        default: both
      dry_run:
        description: "Build and sign, but upload nothing and make no GitHub Release"
        type: boolean
        default: false
      build_number:
        description: "Build number to use instead of run number + 10 (e.g. the one the other store already has); empty computes it"
        type: string
        required: false

run-name: >-
  release ${{ inputs.tag || github.ref_name }}${{ inputs.dry_run && ' (dry run)' || '' }}${{ inputs.platforms && inputs.platforms != 'both' && format(' ({0} only)', inputs.platforms) || '' }}

permissions:
  contents: read

concurrency:
  # One run per tag, pushed or dispatched; never cancel a half-finished upload.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: app

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.request.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      is_trial: ${{ steps.version.outputs.is_trial }}
      platforms: ${{ steps.request.outputs.platforms }}
      dry_run: ${{ steps.request.outputs.dry_run }}
    steps:
      # Runs before any checkout, so the tag is validated before it is used.
      - name: Who, which tag, what
        id: request
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.triggering_actor }}
          RELEASE_ACTORS: ${{ vars.RELEASE_ACTORS }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "${RELEASE_ACTORS//[[:space:],]/}" ]; then
            echo "::error::The repository variable RELEASE_ACTORS is not set. Set it (Settings → Secrets and variables → Actions → Variables) to the comma-separated GitHub logins allowed to release."
            exit 1
          fi
          allowed=false
          IFS=, read -r -a actors <<< "$RELEASE_ACTORS"
          for a in "${actors[@]}"; do
            a="$(echo "$a" | tr -d '[:space:]')"
            if [ -n "$a" ] && [ "$(echo "$a" | tr '[:upper:]' '[:lower:]')" = "$(echo "$ACTOR" | tr '[:upper:]' '[:lower:]')" ]; then
              allowed=true
            fi
          done
          if [ "$allowed" != true ]; then
            echo "::error::'$ACTOR' started this run but is not in RELEASE_ACTORS; only those logins may release."
            exit 1
          fi

          if [ "$EVENT" = workflow_dispatch ]; then
            tag="$INPUT_TAG"
            platforms="${INPUT_PLATFORMS:-both}"
            dry_run="${INPUT_DRY_RUN:-false}"
          elif [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            platforms=both
            dry_run=false
          else
            echo "::error::A release runs on a v* tag or by dispatch with a tag, not on $EVENT of $REF_TYPE '$REF_NAME'."
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not vX.Y.Z or vX.Y.Z-suffix."
            exit 1
          fi
          case "$platforms" in both|android|ios) ;; *)
            echo "::error::platforms must be both, android or ios, not '$platforms'."
            exit 1;;
          esac
          case "$dry_run" in true|false) ;; *)
            echo "::error::dry_run must be true or false, not '$dry_run'."
            exit 1;;
          esac
          echo "::notice::$ACTOR releases $tag to $platforms$([ "$dry_run" = true ] && echo ' (dry run: nothing is uploaded)')"
          {
            echo "tag=$tag"
            echo "platforms=$platforms"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.request.outputs.tag }}

      # The build number is this workflow's run number plus 10, unless a
      # dispatch names one. Both stores refuse a number they have already seen,
      # and numbers were taken before this workflow existed: iOS builds 1 and 2
      # in App Store Connect, Android version codes 1 to 4 uploaded by hand.
      # The run number only grows (a re-run of failed jobs keeps it, which is
      # fine: only what failed runs again), so every release gets a fresh
      # number on both platforms. A dispatch that releases one store for a tag
      # the other store already has passes that store's number, so both carry
      # the same one.
      - name: Version name and build number
        id: version
        env:
          TAG: ${{ steps.request.outputs.tag }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          RUN_NUMBER: ${{ github.run_number }}
          OFFSET: 10
        run: |
          version_name="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)(\+[0-9]+)?[[:space:]]*$/\1/p' pubspec.yaml)"
          if [ -z "$version_name" ]; then
            echo "::error::No 'version: X.Y.Z+N' line in app/pubspec.yaml at $TAG."
            exit 1
          fi
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]
          if [ "${BASH_REMATCH[1]}" != "$version_name" ]; then
            echo "::error::Tag '$TAG' is version ${BASH_REMATCH[1]}, app/pubspec.yaml at that tag says $version_name. Bump the pubspec or fix the tag."
            exit 1
          fi
          if [ -n "${BASH_REMATCH[2]}" ]; then is_trial=true; else is_trial=false; fi
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            if [[ ! "$INPUT_BUILD_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]; then
              echo "::error::build_number '$INPUT_BUILD_NUMBER' is not a positive whole number."
              exit 1
            fi
            build_number="$INPUT_BUILD_NUMBER"
          else
            build_number=$((RUN_NUMBER + OFFSET))
          fi
          sha="$(git rev-parse HEAD)"
          echo "::notice::Version $version_name ($build_number) from $TAG at $sha, trial: $is_trial"
          {
            echo "sha=$sha"
            echo "version_name=$version_name"
            echo "build_number=$build_number"
            echo "is_trial=$is_trial"
          } >> "$GITHUB_OUTPUT"

  android:
    needs: version
    if: ${{ needs.version.outputs.platforms != 'ios' }}
    runs-on: ubuntu-latest
    # Gated: waits for an approval before it can use the signing secrets.
    environment: release
    permissions:
      # The GitHub Release, and nothing more.
      contents: write
    env:
      HAVE_SECRETS: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && 'true' || 'false' }}
      HAVE_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && 'true' || 'false' }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
    steps:
      # The commit the version job checked, even if the tag moved since.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep in sync with mise.toml and app/.fvmrc
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: flutter test

      - name: Restore signing and config from secrets
        if: ${{ env.HAVE_SECRETS == 'true' }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APP_ENV_PROD_JSON: ${{ secrets.APP_ENV_PROD_JSON }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<KP
          storeFile=upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          KP
          echo "$APP_ENV_PROD_JSON" > env/prod.json

      # Play only refuses a repeated version code at upload, after the build;
      # this asks first, so a wrong number stops the run before anything is
      # built. If Play already has this very code, an earlier run uploaded it:
      # the job skips the upload and succeeds (a dry run only reports it). The
      # Ubuntu image has no Bundler on the PATH, so it is installed (with Ruby,
      # if that is missing too); the Gemfile pins fastlane to 2.x.
      - name: Check the version code against Play
        id: play
        if: ${{ env.HAVE_SECRETS == 'true' && env.HAVE_PLAY == 'true' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          BUNDLE_PATH: ${{ runner.temp }}/bundle
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "YES"
        run: |
          if ! command -v bundle > /dev/null; then
            if ! command -v ruby > /dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq ruby-full
            fi
            sudo gem install bundler --no-document
          fi
          ruby -v
          bundle install
          export PLAY_SERVICE_ACCOUNT_JSON_PATH="$RUNNER_TEMP/play.json"
          export LATEST_VERSION_CODE_FILE="$RUNNER_TEMP/latest-version-code"
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_SERVICE_ACCOUNT_JSON_PATH"
          status=0
          bundle exec fastlane android latest_version_code || status=$?
          rm -f "$PLAY_SERVICE_ACCOUNT_JSON_PATH"
          if [ "$status" -ne 0 ] || [ ! -s "$LATEST_VERSION_CODE_FILE" ]; then
            echo "::error::Could not read the version codes from Google Play (see the fastlane output above; an API error may be transient, re-run the job)."
            exit 1
          fi
          latest="$(cat "$LATEST_VERSION_CODE_FILE")"
          if [ "$BUILD_NUMBER" -lt "$latest" ]; then
            echo "::error::Version code $BUILD_NUMBER is below $latest, the highest on Google Play. Raise OFFSET in the version job, or dispatch with a higher build_number."
            exit 1
          fi
          if [ "$BUILD_NUMBER" -eq "$latest" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::notice::Dry run: version code $BUILD_NUMBER is already on Google Play; a real run would skip the Play upload."
            else
              echo "::notice::Version code $BUILD_NUMBER is already on Google Play: already uploaded, skipping the Play upload."
            fi
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Version code $BUILD_NUMBER (Play's highest so far: $latest)"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      # The GitHub Release is made once: not for a trial or a dry run, and not
      # again if a run before this one made it.
      - name: Does the GitHub Release exist
        id: ghrelease
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TRIAL: ${{ needs.version.outputs.is_trial }}
        run: |
          if [ "$IS_TRIAL" = true ]; then
            echo "create=false" >> "$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" = true ]; then
            echo "::notice::Dry run: no GitHub Release."
            echo "create=false" >> "$GITHUB_OUTPUT"
          elif out="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1)"; then
            echo "::notice::The GitHub Release $TAG exists already; leaving it as it is."
            echo "create=false" >> "$GITHUB_OUTPUT"
          elif [[ "$out" == *"release not found"* ]]; then
            echo "create=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not look up the GitHub Release $TAG: $out"
            exit 1
          fi

      # Skipped when Play has the build and the GitHub Release needs no files,
      # except in a dry run, whose point is to build and sign.
      - name: Build release (signed)
        if: ${{ env.HAVE_SECRETS == 'true' && (env.DRY_RUN == 'true' || steps.play.outputs.uploaded != 'true' || steps.ghrelease.outputs.create == 'true') }}
        run: |
          flutter build appbundle --release --dart-define-from-file=env/prod.json \
            --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER"
          flutter build apk --release --dart-define-from-file=env/prod.json \
            --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER"

      - name: Build debug (no secrets)
        if: ${{ env.HAVE_SECRETS != 'true' }}
        run: |
          flutter build apk --debug --dart-define-from-file=env/ci.json \
            --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER"

      - name: GitHub Release
        if: ${{ steps.ghrelease.outputs.create == 'true' }}
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          # A dispatch runs on a branch, so the tag is named explicitly.
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Play internal testing
        if: ${{ env.HAVE_SECRETS == 'true' && env.HAVE_PLAY == 'true' && env.DRY_RUN != 'true' && steps.play.outputs.uploaded != 'true' }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.orkitec.velorki
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Dry run
        if: ${{ env.DRY_RUN == 'true' }}
        run: echo "::notice::Dry run of $TAG ($VERSION_NAME, $BUILD_NUMBER) for Android finished; nothing was uploaded."

  ios:
    needs: version
    if: ${{ needs.version.outputs.platforms != 'android' }}
    runs-on: macos-15
    timeout-minutes: 90
    # Required reviewer: the approval gate for signing and uploading.
    environment: release
    permissions:
      contents: read
    env:
      HAVE_SIGNING: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8_BASE64 != '' && secrets.IOS_DEV_CERT_P12_BASE64 != '' && secrets.APP_ENV_PROD_JSON != '' && 'true' || 'false' }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION_NAME: ${{ needs.version.outputs.version_name }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      DRY_RUN: ${{ needs.version.outputs.dry_run }}
      ARCHIVE_PATH: build/ios/archive/Runner.xcarchive

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      # The image's default Xcode 16.4 cannot compile device_info_plus (an
      # iOS 17 NSProcessInfo selector); the app is built with Xcode 26 on the
      # Mac, so pick the newest 26 on the runner.
      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep in sync with mise.toml and app/.fvmrc
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n

      - name: Build unsigned (no secrets)
        if: ${{ env.HAVE_SIGNING != 'true' }}
        run: |
          echo "::notice::iOS signing secrets are not configured — building unsigned and skipping TestFlight. See docs/RELEASE_IOS.md."
          flutter build ios --release --no-codesign --dart-define-from-file=env/ci.json \
            --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER"

      - name: Install the API key and the development identity
        if: ${{ env.HAVE_SIGNING == 'true' }}
        env:
          APP_ENV_PROD_JSON: ${{ secrets.APP_ENV_PROD_JSON }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_DEV_CERT_P12_BASE64: ${{ secrets.IOS_DEV_CERT_P12_BASE64 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          echo "$APP_ENV_PROD_JSON" > env/prod.json

          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

          # A throwaway keychain for the development identity, first in the
          # search list so codesign finds it without prompting.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          p12="$RUNNER_TEMP/dev.p12"
          echo "$IOS_DEV_CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 -P "$IOS_DEV_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          search_list=()
          while read -r k; do
            if [ -n "$k" ]; then search_list+=("$k"); fi
          done < <(security list-keychains -d user | tr -d '"')
          security list-keychains -d user -s "$keychain" "${search_list[@]}"
          rm -f "$p12"
          echo "KEYCHAIN_PATH=$keychain" >> "$GITHUB_ENV"

      # App Store Connect only refuses a repeated build number at upload, after
      # a long archive; this asks first. If its newest build is this very
      # number, an earlier run uploaded it: the job skips the archive and the
      # upload and succeeds (a dry run only reports it, and archives anyway).
      # The image's Ruby; the Gemfile pins fastlane to 2.x.
      - name: Check the build number against App Store Connect
        id: asc
        if: ${{ env.HAVE_SIGNING == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_PATH: ${{ runner.temp }}/bundle
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "YES"
        run: |
          bundle install
          export LATEST_BUILD_NUMBER_FILE="$RUNNER_TEMP/latest-build-number"
          if ! bundle exec fastlane ios latest_build_number || [ ! -s "$LATEST_BUILD_NUMBER_FILE" ]; then
            echo "::error::Could not read the latest build number from App Store Connect (see the fastlane output above; an API error may be transient, re-run the job)."
            exit 1
          fi
          latest="$(cat "$LATEST_BUILD_NUMBER_FILE")"
          if [ "$BUILD_NUMBER" -lt "$latest" ]; then
            echo "::error::Build number $BUILD_NUMBER is below $latest, the latest on App Store Connect. Raise OFFSET in the version job, or dispatch with a higher build_number."
            exit 1
          fi
          if [ "$BUILD_NUMBER" -eq "$latest" ]; then
            if [ "$DRY_RUN" = true ]; then
              echo "::notice::Dry run: build $BUILD_NUMBER is already on App Store Connect; a real run would skip the archive and the upload."
            else
              echo "::notice::Build $BUILD_NUMBER is already on App Store Connect: already uploaded, skipping the archive and the upload."
            fi
            echo "uploaded=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Build number $BUILD_NUMBER (App Store Connect's latest so far: $latest)"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive
        if: ${{ env.HAVE_SIGNING == 'true' && (env.DRY_RUN == 'true' || steps.asc.outputs.uploaded != 'true') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # `flutter build ipa` cannot pass the API key to xcodebuild, so
          # Flutter only writes its configuration (dart-defines, version, build
          # number, pods) and xcodebuild archives; the Flutter build phase
          # compiles the Dart inside the archive.
          flutter build ios --config-only --release \
            --dart-define-from-file=env/prod.json \
            --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER"
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination generic/platform=iOS -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        if: ${{ env.HAVE_SIGNING == 'true' && env.DRY_RUN != 'true' && steps.asc.outputs.uploaded != 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # ExportOptions.plist with destination `upload`: signed and sent to
          # App Store Connect in one go, leaving no .ipa behind.
          plutil -replace destination -string upload \
            -o "$RUNNER_TEMP/ExportUpload.plist" ios/ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportUpload.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Dry run
        if: ${{ env.DRY_RUN == 'true' }}
        run: echo "::notice::Dry run of $TAG ($VERSION_NAME, $BUILD_NUMBER) for iOS finished; nothing was uploaded."

      - name: Remove the key and the keychain
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/dev.p12" env/prod.json
