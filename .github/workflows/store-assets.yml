name: store assets

# The App Store screenshots (iPhone, 13" iPad and iPhone Duo), the watch shots and the
# preview videos, made by app/tool/store_screenshots.sh on iOS simulators
# exactly as on the Mac, and
# on request uploaded to an App Store version; and the Google Play sets (`android`:
# the phone's and the tablets'), made by the same script on Android emulators,
# and on request uploaded to the Play store listing. Started by hand only; see docs/STORE_ASSETS.md.
#
# `assets` and `android` need no secrets and run from any ref. `upload` and
# `android_upload` run in the `release` environment, which admits `v*` tags
# and `main` and waits for the maintainer's approval. They replace the
# screenshots and, with `metadata`, the texts of every uploaded language (on
# that App Store version, on the Play listing); the preview video stays a
# manual upload. `assets_run_id` uploads the sets an earlier run captured
# instead of capturing again (artifacts are kept 30 days).
on:
  workflow_dispatch:
    inputs:
      locales:
        description: Languages, comma-separated
        type: string
        default: en,de,fr,es,it,nl
      ios:
        description: The App Store sets, iPhone, iPad and iPhone Duo (iOS simulator)
        type: boolean
        default: true
      # A subset captures and uploads only those; the upload then replaces
      # only their device types on App Store Connect (the iPhone's carries
      # the watch shots).
      ios_sets:
        description: Which App Store sets, comma-separated (iphone, ipad, duo)
        type: string
        default: iphone,ipad,duo
      # Off by default: an hour and more on the emulator. The map is drawn
      # with MapLibre's Vulkan renderer there (docs/STORE_ASSETS.md).
      android:
        description: The Google Play sets, phone and tablet (Android emulator)
        type: boolean
        default: false
      # The runner's simulator has no GPU and drops frames of the moving map;
      # the preview for the store is recorded on a Mac (docs/STORE_ASSETS.md).
      preview:
        description: Also record the preview video (choppier than on a Mac)
        type: boolean
        default: false
      upload:
        description: Upload the chosen sets to App Store Connect / Google Play (from a v* tag or main)
        type: boolean
        default: false
      metadata:
        description: Also upload the store texts (fastlane/metadata/ios, /android)
        type: boolean
        default: false
      # Off for a run that only brings the texts or the creative assets.
      screenshots:
        description: Upload the App Store screenshots (off to send only texts or creative assets)
        type: boolean
        default: true
      creative:
        description: Also place the creative assets (product page header, search results image); needs a fastlane with fastlane#30442
        type: boolean
        default: false
      app_version:
        description: App Store version to put them on, e.g. 1.0.1 (needed to upload iOS)
        type: string
        default: ""
      verbose:
        description: Keep flutter's verbose test log of each capture (an artifact)
        type: boolean
        default: false
      assets_run_id:
        description: Upload the set of this earlier run instead of capturing (its run id)
        type: string
        default: ""

permissions:
  contents: read

# One run at a time per ref and platform set: a Play upload waiting days for
# its approval must not hold up an App Store run.
concurrency:
  group: store-assets-${{ github.ref }}-ios-${{ inputs.ios }}-android-${{ inputs.android }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.4"  # keep in sync with mise.toml and app/.fvmrc

jobs:
  # The languages, and the capture jobs. A job takes all its languages and
  # both themes in one run of the app (the test switches them in place).
  # On iOS English is a job of its own (the iPhone's and the iPad's in one,
  # the Duo's in another), because the simulator's region, which decides
  # the status bar's 9:41 AM or 09:41, changes only with a reboot: five
  # macOS jobs, what a free account runs at once. Android takes a job per
  # language and device, as the emulator draws slowly and Linux jobs are many.
  locales:
    if: ${{ (inputs.ios || inputs.android) && inputs.assets_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      locales: ${{ steps.list.outputs.locales }}
      list: ${{ steps.list.outputs.list }}
      ios_jobs: ${{ steps.list.outputs.ios_jobs }}
    steps:
      - id: list
        env:
          LOCALES: ${{ inputs.locales }}
          IOS_SETS: ${{ inputs.ios_sets }}
        run: |
          [[ "$IOS_SETS" =~ ^(iphone|ipad|duo)(,(iphone|ipad|duo))*$ ]] \
            || { echo "::error::ios_sets takes iphone, ipad and duo, comma-separated, not '$IOS_SETS'"; exit 1; }
          json=$(printf '%s' "$LOCALES" | tr ',' '\n' | sed 's/^ *//; s/ *$//' | grep -v '^$' | jq -R . | jq -cs .)
          [ "$json" != "[]" ] || { echo "::error::no locales"; exit 1; }
          echo "locales=$(printf '%s' "$json" | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"
          echo "list=$json" >> "$GITHUB_OUTPUT"
          # {id, sets, locales} per macOS job: English on the iPhone and the
          # iPad together, on the Duo alone; the other languages per device.
          jobs=$(jq -cn --argjson locales "$json" --arg sets "$IOS_SETS" '
            ($sets | split(",")) as $sets
            | ($locales | map(select(startswith("en")))) as $en
            | ($locales | map(select(startswith("en") | not))) as $rest
            | [ (if ($en | length) > 0 then
                  ([$sets[] | select(. != "duo")] as $s
                   | if ($s | length) > 0 then {id: "en", sets: ($s | join(",")), locales: ($en | join(","))} else empty end),
                  (if ($sets | index("duo")) then {id: "en-duo", sets: "duo", locales: ($en | join(","))} else empty end)
                else empty end),
                (if ($rest | length) > 0 then
                  ($sets[] | {id: ., sets: ., locales: ($rest | join(","))})
                else empty end) ]')
          echo "ios_jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "$jobs" | jq .

  assets:
    needs: locales
    if: ${{ inputs.ios && inputs.assets_run_id == '' }}
    runs-on: xcode-27
    # The job's languages and both themes on each of its devices; with the
    # iPhone also the watch shots and, when asked for, the preview, recorded
    # once per language.
    timeout-minutes: 240
    name: assets (${{ matrix.job.id }})
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.locales.outputs.ios_jobs) }}
    env:
      LOCALES: ${{ matrix.job.locales }}
      VELORKI_STORE_VERBOSE: ${{ inputs.verbose && '1' || '' }}
      # store_screenshots.sh prints memory, disk, the busiest processes, the
      # booted simulators and the test's last line every three minutes.
      VELORKI_STORE_MONITOR: "180"

    steps:
      # An upload that cannot happen should say so now, not after the capture.
      - name: Check the inputs
        if: ${{ inputs.upload }}
        env:
          APP_VERSION: ${{ inputs.app_version }}
          REF: ${{ github.ref }}
        run: |
          [ -n "$APP_VERSION" ] || { echo "::error::upload needs app_version"; exit 1; }
          case "$REF" in
            refs/tags/v* | refs/heads/main) ;;
            *) echo "::error::upload runs only from a v* tag or main, not $REF"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Xcode the app is built with (the Mac's too). The xcode-27 image
      # also carries betas, whose builds the App Store refuses: name a
      # release or release candidate. 27.1: the iPhone Duo's whole inner
      # screen needs its SDK.
      - name: Select Xcode
        env:
          XCODE_VERSION: "27.1"
        run: |
          xcode="/Applications/Xcode_${XCODE_VERSION}.app"
          [ -d "$xcode" ] || { echo "::error::no $xcode on the runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # The watch shots need a watchOS simulator runtime for that Xcode; the
      # image usually has one, and a download is a few GB when it has not.
      - name: watchOS simulator runtime
        if: ${{ contains(format(',{0},', matrix.job.sets), ',iphone,') }}
        run: |
          if xcrun simctl list runtimes | grep -q '^watchOS'; then
            xcrun simctl list runtimes | grep '^watchOS'
          else
            echo "::notice::no watchOS runtime on the image; downloading it"
            xcodebuild -downloadPlatform watchOS
            xcrun simctl list runtimes | grep '^watchOS' \
              || { echo "::error::still no watchOS simulator runtime"; exit 1; }
          fi

      # store_slides.py drives headless Chrome, which the image ships;
      # store_preview.py wants ffmpeg, which it does not.
      - name: Chrome and ffmpeg
        env:
          PREVIEW: ${{ inputs.preview }}
        run: |
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          [ -x "$chrome" ] || { echo "::error::no Google Chrome at $chrome"; exit 1; }
          "$chrome" --version
          if [ "$PREVIEW" = true ]; then
            brew install ffmpeg
            echo "FFMPEG=$(brew --prefix)/bin/ffmpeg" >> "$GITHUB_ENV"
            echo "FFPROBE=$(brew --prefix)/bin/ffprobe" >> "$GITHUB_ENV"
          fi

      # flutter-action's cache: true already covers the SDK and ~/.pub-cache.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Week stamp
        id: stamp
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # The derived data integration-ios.yml saves on main, under the same
      # keys; read here, never written.
      - name: Restore the Xcode derived data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            derived-xcode27-${{ env.FLUTTER_VERSION }}-${{
            hashFiles('app/ios/Podfile.lock') }}-${{ steps.stamp.outputs.week }}
          restore-keys: |
            derived-xcode27-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/ios/Podfile.lock') }}-

      # The Swift packages Xcode clones into app/build/ios (Flutter's place
      # for them, not the derived data), under integration-ios.yml's key:
      # fetched fresh, every package was cloned and compiled again.
      - name: Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/build/ios/SourcePackages
          key: swiftpm-xcode27-${{ hashFiles('app/ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: swiftpm-xcode27-

      - name: Prepare the app package
        working-directory: app
        run: |
          flutter pub get
          dart run build_runner build
          flutter gen-l10n

      # New York's tile and gazetteer for the cycle map shots: the script
      # fetches them with curl from the tile mirror's current snapshot into
      # VELORKI_STORE_TILES unless they are there; cached per snapshot.
      - name: Mirror snapshot
        id: snapshot
        run: |
          set -euo pipefail
          tag=$(curl --retry 3 --retry-all-errors --fail --location --silent --show-error \
            --user-agent "velorki-ci (+https://github.com/orkitec/velorki)" \
            https://raw.githubusercontent.com/orkitec/velorki-data/main/latest.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "VELORKI_STORE_TILES=$HOME/store-tiles" >> "$GITHUB_ENV"

      - name: New York tile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/store-tiles
          key: store-tiles-W75_N40-${{ steps.snapshot.outputs.tag }}

      - name: Screenshots and slides
        id: iphone
        if: ${{ contains(format(',{0},', matrix.job.sets), ',iphone,') }}
        working-directory: app
        env:
          # The runner's first build of the test app alone takes eight minutes.
          VELORKI_STORE_START_TIMEOUT: "1500"
        run: tool/store_screenshots.sh --locales "$LOCALES"

      # The App Store's creative assets (the product page header and the
      # search results image) from the same captures. Uploaded by hand to
      # the Asset Library, so they only ride along in the artifact.
      - name: Creative assets
        if: ${{ !cancelled() && steps.iphone.outcome == 'success' }}
        continue-on-error: true
        working-directory: app
        run: python3 tool/store_creative.py --locales "$LOCALES"

      # Each platform's set is kept as soon as it is made, in an artifact of
      # its own (store-assets-ios-*, merged again for the upload): a runner
      # that dies later loses only what it was doing. A path's tree is kept
      # from before its first wildcard, so `?pad` keeps the `ipad/` folder (a
      # one-letter `[i]` counts as a literal there).
      - name: Keep the iPhone set
        if: ${{ !cancelled() && steps.iphone.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-assets-ios-iphone-${{ matrix.job.id }}
          path: |
            app/build/store_screenshots/slides/set
            app/build/store_screenshots/watch
            app/build/store_screenshots/creative
          if-no-files-found: ${{ steps.iphone.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 30

      - name: iPad screenshots and slides
        id: ipad
        # Each device's set stands on its own: one failing keeps the others.
        if: ${{ !cancelled() && contains(format(',{0},', matrix.job.sets), ',ipad,') }}
        working-directory: app
        env:
          VELORKI_STORE_START_TIMEOUT: "1500"
        # The iPhone's and the watch's simulators, when this job had them, are
        # shut down first: one at a time on a 7 GB runner.
        run: |
          xcrun simctl shutdown all || true
          tool/store_screenshots.sh --platform ipad --locales "$LOCALES"

      - name: Keep the iPad set
        if: ${{ !cancelled() && steps.ipad.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-assets-ios-ipad-${{ matrix.job.id }}
          path: app/build/store_screenshots/?pad/slides/set
          if-no-files-found: ${{ steps.ipad.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 30

      # The Duo needs an iOS 27.1 simulator runtime; the image may carry only
      # 27.0. Downloaded (several GB) for the Xcode selected above when no
      # installed runtime has the device, as the watchOS step does.
      - name: iOS simulator runtime for the iPhone Duo
        if: ${{ contains(format(',{0},', matrix.job.sets), ',duo,') }}
        run: |
          has_duo() {
            xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          sys.exit(not any(r["isAvailable"] and any(d["identifier"].endswith(".iPhone-Duo")
                                                    for d in r.get("supportedDeviceTypes", []))
                           for r in json.load(sys.stdin)["runtimes"]))'
          }
          xcrun simctl list runtimes | grep '^iOS'
          df -h / "$HOME"
          if ! has_duo; then
            echo "::notice::no iOS runtime with the iPhone Duo on the image; downloading the one for this Xcode"
            xcodebuild -downloadPlatform iOS
            xcrun simctl list runtimes | grep '^iOS'
            df -h / "$HOME"
            has_duo || { echo "::error::still no iOS simulator runtime with the iPhone Duo"; exit 1; }
          fi

      # The Duo's inner display, unfolded (tool/duo_state.c), on a simulator
      # the script creates on the newest runtime that has the device.
      - name: iPhone Duo screenshots and slides
        id: duo
        if: ${{ contains(format(',{0},', matrix.job.sets), ',duo,') }}
        working-directory: app
        env:
          VELORKI_STORE_START_TIMEOUT: "1500"
        run: tool/store_screenshots.sh --platform duo --locales "$LOCALES"

      - name: Keep the iPhone Duo set
        if: ${{ !cancelled() && steps.duo.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-assets-ios-duo-${{ matrix.job.id }}
          path: app/build/store_screenshots/?uo/slides/set
          if-no-files-found: ${{ steps.duo.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 30

      - name: Preview video
        id: preview
        if: ${{ !cancelled() && inputs.preview && contains(format(',{0},', matrix.job.sets), ',iphone,') }}
        working-directory: app
        env:
          VELORKI_STORE_START_TIMEOUT: "1500"
        run: |
          xcrun simctl shutdown all || true
          tool/store_screenshots.sh --preview --locales "$LOCALES"

      - name: Keep the preview
        if: ${{ !cancelled() && steps.preview.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-assets-ios-preview-${{ matrix.job.id }}
          path: |
            app/build/store_screenshots/?review/*/preview*.mp4
            app/build/store_screenshots/?review/*/poster*.png
          if-no-files-found: ${{ steps.preview.outcome == 'success' && 'error' || 'warn' }}
          retention-days: 30

      - name: Mirror log
        if: failure()
        run: cat mirror.log || true

      - name: Keep the verbose logs
        if: ${{ !cancelled() && inputs.verbose }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-logs-ios-${{ matrix.job.id }}
          path: app/build/store_screenshots/**/logs
          if-no-files-found: ignore
          retention-days: 7

  upload:
    needs: assets
    # After a capture in this run, or straight away with an earlier run's set.
    if: >-
      ${{ always() && inputs.ios && inputs.upload
      && (needs.assets.result == 'success'
      || (needs.assets.result == 'skipped' && inputs.assets_run_id != '')) }}
    # macOS for sips, which the staging script uses.
    runs-on: xcode-27
    timeout-minutes: 45
    # Required reviewer: nothing reaches App Store Connect before approval.
    environment: release
    permissions:
      contents: read
      # An earlier run's artifact.
      actions: read

    steps:
      - name: Check the inputs
        env:
          APP_VERSION: ${{ inputs.app_version }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ inputs.assets_run_id }}
          IOS_SETS: ${{ inputs.ios_sets }}
        run: |
          [ -n "$APP_VERSION" ] || { echo "::error::upload needs app_version"; exit 1; }
          [[ "$IOS_SETS" =~ ^(iphone|ipad|duo)(,(iphone|ipad|duo))*$ ]] \
            || { echo "::error::ios_sets takes iphone, ipad and duo, comma-separated, not '$IOS_SETS'"; exit 1; }
          case "$REF" in
            refs/tags/v* | refs/heads/main) ;;
            *) echo "::error::upload runs only from a v* tag or main, not $REF"; exit 1 ;;
          esac
          if [ -n "$RUN_ID" ] && ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::assets_run_id must be a run id (digits), not '$RUN_ID'"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One artifact per set and job (store-assets-ios-iphone-en,
      # -ipad-ipad, -duo-en-duo, ...), merged into one tree.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: store-assets-ios-*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
          run-id: ${{ inputs.assets_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Stage the screenshots for deliver
        working-directory: app
        env:
          STORE_SETS: ${{ inputs.ios_sets }}
        run: tool/store_stage_deliver.sh "$RUNNER_TEMP/assets" "$RUNNER_TEMP/screenshots"

      # The image's Ruby; the Gemfile pins fastlane to 2.x.
      - name: fastlane
        working-directory: app
        env:
          BUNDLE_PATH: ${{ runner.temp }}/bundle
        run: |
          ruby -v
          bundle install

      - name: Upload to App Store Connect
        working-directory: app
        env:
          BUNDLE_PATH: ${{ runner.temp }}/bundle
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APP_VERSION: ${{ inputs.app_version }}
          UPLOAD_METADATA: ${{ inputs.metadata }}
          UPLOAD_CREATIVE: ${{ inputs.creative }}
          UPLOAD_SCREENSHOTS: ${{ inputs.screenshots }}
          CREATIVE_PATH: ${{ runner.temp }}/assets/creative
          STORE_SETS: ${{ inputs.ios_sets }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "YES"
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          export SCREENSHOTS_PATH="$RUNNER_TEMP/screenshots"
          bundle exec fastlane ios store_assets

      - name: Remove the key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  # The Google Play sets, one job per language and device: the phone's on the
  # emulator integration.yml runs (API 35, Pixel 6 profile), with its system
  # image step and, read only, its Gradle and AVD caches; the tablets' on a
  # Pixel Tablet profile (2560x1600 landscape, the app's wide layout) of the
  # same image, its AVD made fresh. One tablet set goes up as both the 7-inch
  # and the 10-inch screenshots.
  android:
    needs: locales
    if: ${{ inputs.android && inputs.assets_run_id == '' }}
    runs-on: ubuntu-latest
    # The tablet has 1.6 times the phone's pixels for Lavapipe to draw.
    timeout-minutes: ${{ matrix.device == 'tablet' && 120 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        locale: ${{ fromJSON(needs.locales.outputs.list) }}
        device: [phone, tablet]
        include:
          - device: phone
            profile: pixel_6
            platform: android
            artifact: store-assets-android
            # The tree from slides/set down: <locale>/NN-<slide>.png, the
            # feature graphic, the contact sheets and the icon.
            set: app/build/store_screenshots/android/slides/set
          - device: tablet
            profile: pixel_tablet
            platform: android-tablet
            artifact: store-assets-android-tablet
            # `?ablet` keeps the `tablet/` folder in the artifact (see the
            # iPad's), so it merges beside the phone's set.
            set: app/build/store_screenshots/android-tablet/slides/set/?ablet
    env:
      API_LEVEL: "35"

    steps:
      - name: Check the inputs
        if: ${{ inputs.upload }}
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v* | refs/heads/main) ;;
            *) echo "::error::upload runs only from a v* tag or main, not $REF"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # store_slides.py drives headless Chrome, which the image ships. Ubuntu
      # keeps unprivileged user namespaces from AppArmor-confined programs,
      # which Chrome's sandbox needs.
      - name: Chrome
        run: |
          chrome="$(command -v google-chrome)"
          [ -n "$chrome" ] || { echo "::error::no google-chrome on the runner"; exit 1; }
          "$chrome" --version
          echo "CHROME=$chrome" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Restore the Gradle caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            gradle-itest-${{ env.API_LEVEL }}-${{
            hashFiles('app/android/**/*.gradle*', 'app/pubspec.lock') }}
          restore-keys: |
            gradle-itest-${{ env.API_LEVEL }}-

      - name: Prepare the app package
        working-directory: app
        run: |
          flutter pub get
          dart run build_runner build
          flutter gen-l10n

      # The Android Gradle plugin installs the NDK during the build with no
      # check: a download that arrived broken ("Error on ZipFile unknown
      # archive") failed a build. So it is installed here first, the version
      # Flutter's Gradle plugin asks for, verified by the file the plugin
      # looks for, and fetched again on a bad archive.
      - name: Install the NDK
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          root="$(dirname "$(dirname "$(command -v flutter)")")"
          ver="$(sed -n 's/.*val ndkVersion: String = "\([^"]*\)".*/\1/p' \
            "$root/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")"
          [ -n "$ver" ] || { echo "::error::no ndkVersion in Flutter's FlutterExtension.kt"; exit 1; }
          for try in 1 2 3; do
            printf 'y\n%.0s' {1..30} \
              | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ver" || true
            if [ -f "$sdk/ndk/$ver/source.properties" ]; then
              echo "==> ndk;$ver in place"
              exit 0
            fi
            echo "==> ndk;$ver did not install cleanly (try $try of 3); fetching it again"
            rm -rf "$sdk/ndk/$ver" "$sdk/.temp"
            sleep 20
          done
          echo "::error::ndk;$ver could not be installed"
          exit 1

      # As in integration.yml: installed and checked here, so the emulator
      # action finds it in place.
      - name: Install the system image
        id: sysimg
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          pkg="system-images;android-$API_LEVEL;google_apis;x86_64"
          dir="$sdk/system-images/android-$API_LEVEL/google_apis/x86_64"
          for try in 1 2 3; do
            printf 'y\n%.0s' {1..30} \
              | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "$pkg" || true
            if [ -s "$dir/system.img" ] && [ -f "$dir/package.xml" ]; then
              revision=$(sed -n 's/.*<major>\([0-9]*\)<\/major>.*/\1/p' "$dir/package.xml" | head -n 1)
              echo "revision=${revision:-0}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "==> $pkg did not install cleanly (try $try of 3); fetching it again"
            rm -rf "$dir" "$sdk/.temp"
            sleep 20
          done
          echo "::error::$pkg could not be installed"
          exit 1

      # integration.yml's AVD and snapshot, under its key; on a miss (and
      # always for the tablet, which it has no AVD for) the emulator action
      # creates the AVD and boots it cold.
      - name: Restore the AVD
        if: ${{ matrix.device == 'phone' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-google_apis-pixel_6-r${{ steps.sysimg.outputs.revision }}

      # New York's tile and gazetteer for the cycle map shots: the script
      # fetches them with curl from the tile mirror's current snapshot into
      # VELORKI_STORE_TILES unless they are there; cached per snapshot.
      - name: Mirror snapshot
        id: snapshot
        run: |
          set -euo pipefail
          tag=$(curl --retry 3 --retry-all-errors --fail --location --silent --show-error \
            --user-agent "velorki-ci (+https://github.com/orkitec/velorki)" \
            https://raw.githubusercontent.com/orkitec/velorki-data/main/latest.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "VELORKI_STORE_TILES=$HOME/store-tiles" >> "$GITHUB_ENV"

      - name: New York tile cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/store-tiles
          key: store-tiles-W75_N40-${{ steps.snapshot.outputs.tag }}

      - name: Screenshots and slides
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          LOCALES: ${{ matrix.locale }}
          PLATFORM: ${{ matrix.platform }}
          VELORKI_STORE_START_TIMEOUT: "1500"
          ORG_GRADLE_PROJECT_velorkiMapVulkan: "true"
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          working-directory: app
          force-avd-creation: false
          # software: Lavapipe for Vulkan; GLES is still the old SwiftShader
          # translator, under which MapLibre's OpenGL renderer draws no
          # labels, icons or dashed lines. So the app is built with
          # MapLibre's Vulkan renderer here (velorkiMapVulkan, see the
          # app's build.gradle.kts). guest is only an alias for
          # swiftshader_indirect. -no-snapshot: integration.yml's snapshot
          # was made under another renderer.
          emulator-options: >-
            -no-window -no-snapshot -no-audio -no-boot-anim
            -gpu software -camera-back none -camera-front none
          disable-animations: true
          # One line: the action runs the script line by line.
          # The device log is kept for a failed run: the emulator is gone
          # once this step ends.
          script: tool/store_screenshots.sh --platform "$PLATFORM" --locales "$LOCALES" || { timeout 60 adb -s emulator-5554 logcat -d > build/logcat.txt; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}-${{ matrix.locale }}
          path: ${{ matrix.set }}
          if-no-files-found: error
          retention-days: 30

      - name: Mirror log
        if: failure()
        run: cat mirror.log || true

      - name: Device log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-logcat-android-${{ matrix.device }}-${{ matrix.locale }}
          path: app/build/logcat.txt
          if-no-files-found: ignore
          retention-days: 7

  android_upload:
    needs: android
    # After a capture in this run, or straight away with an earlier run's set.
    if: >-
      ${{ always() && inputs.android && inputs.upload
      && (needs.android.result == 'success'
      || (needs.android.result == 'skipped' && inputs.assets_run_id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewer: nothing reaches Google Play before approval.
    environment: release
    permissions:
      contents: read
      # An earlier run's artifact.
      actions: read

    steps:
      - name: Check the inputs
        env:
          REF: ${{ github.ref }}
          RUN_ID: ${{ inputs.assets_run_id }}
        run: |
          case "$REF" in
            refs/tags/v* | refs/heads/main) ;;
            *) echo "::error::upload runs only from a v* tag or main, not $REF"; exit 1 ;;
          esac
          if [ -n "$RUN_ID" ] && ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::assets_run_id must be a run id (digits), not '$RUN_ID'"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # One artifact per language and device (store-assets-android-<locale>,
      # store-assets-android-tablet-<locale> with its tablet/ folder), or one
      # per device from an earlier run; merged into one set.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: store-assets-android*
          merge-multiple: true
          path: ${{ runner.temp }}/assets
          run-id: ${{ inputs.assets_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Stage the listing for supply
        working-directory: app
        run: tool/store_stage_supply.sh "$RUNNER_TEMP/assets" "$RUNNER_TEMP/listing"

      # As in release.yml: the Ubuntu image has no Bundler on the PATH; the
      # Gemfile pins fastlane to 2.x.
      - name: fastlane
        working-directory: app
        env:
          BUNDLE_PATH: ${{ runner.temp }}/bundle
        run: |
          if ! command -v bundle > /dev/null; then
            if ! command -v ruby > /dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq ruby-full
            fi
            sudo gem install bundler --no-document
          fi
          ruby -v
          bundle install

      # The service account release.yml uploads the builds with.
      - name: Upload to Google Play
        working-directory: app
        env:
          BUNDLE_PATH: ${{ runner.temp }}/bundle
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD_METADATA: ${{ inputs.metadata }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "YES"
        run: |
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::no PLAY_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          export PLAY_SERVICE_ACCOUNT_JSON_PATH="$RUNNER_TEMP/play.json"
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_SERVICE_ACCOUNT_JSON_PATH"
          export PLAY_METADATA_PATH="$RUNNER_TEMP/listing"
          bundle exec fastlane android store_listing

      - name: Remove the key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/play.json"
