name: store assets

# The App Store screenshots, the watch shots and the preview videos, made by
# app/tool/store_screenshots.sh on an iOS simulator exactly as on the Mac, and
# on request uploaded to an App Store version. Started by hand only; see
# docs/STORE_ASSETS.md.
#
# `assets` needs no secrets and runs from any ref. `upload` runs in the
# `release` environment, which admits only `v*` tags and waits for the
# maintainer's approval, so an upload is dispatched from a tag. It replaces the
# screenshots of every uploaded language on that version; the preview video
# stays a manual upload.
on:
  workflow_dispatch:
    inputs:
      locales:
        description: Languages, comma-separated
        type: string
        default: en,de
      # The runner's simulator has no GPU and drops frames of the moving map;
      # the preview for the store is recorded on a Mac (docs/STORE_ASSETS.md).
      preview:
        description: Also record the preview video (choppier than on a Mac)
        type: boolean
        default: false
      upload:
        description: Upload the screenshots to App Store Connect (from a v* tag)
        type: boolean
        default: false
      metadata:
        description: Also upload the store texts (fastlane/metadata/ios)
        type: boolean
        default: false
      app_version:
        description: App Store version to put them on, e.g. 1.0.1 (needed to upload)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: store-assets-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.4"  # keep in sync with mise.toml and app/.fvmrc

jobs:
  assets:
    runs-on: macos-15
    # Each language is its own capture with a simulator reboot, and the
    # preview records every language again.
    timeout-minutes: 240

    steps:
      # An upload that cannot happen should say so now, not after the capture.
      - name: Check the inputs
        if: ${{ inputs.upload }}
        env:
          APP_VERSION: ${{ inputs.app_version }}
          REF: ${{ github.ref }}
        run: |
          [ -n "$APP_VERSION" ] || { echo "::error::upload needs app_version"; exit 1; }
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::upload runs only from a v* tag, not $REF"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The image's default Xcode 16.4 cannot compile device_info_plus (an
      # iOS 17 NSProcessInfo selector); the app is built with Xcode 26 on the
      # Mac, so pick the newest 26 on the runner.
      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # The watch shots need a watchOS simulator runtime for that Xcode; the
      # image usually has one, and a download is a few GB when it has not.
      - name: watchOS simulator runtime
        run: |
          if xcrun simctl list runtimes | grep -q '^watchOS'; then
            xcrun simctl list runtimes | grep '^watchOS'
          else
            echo "::notice::no watchOS runtime on the image; downloading it"
            xcodebuild -downloadPlatform watchOS
            xcrun simctl list runtimes | grep '^watchOS' \
              || { echo "::error::still no watchOS simulator runtime"; exit 1; }
          fi

      # store_slides.py drives headless Chrome, which the image ships;
      # store_preview.py wants ffmpeg, which it does not.
      - name: Chrome and ffmpeg
        env:
          PREVIEW: ${{ inputs.preview }}
        run: |
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          [ -x "$chrome" ] || { echo "::error::no Google Chrome at $chrome"; exit 1; }
          "$chrome" --version
          if [ "$PREVIEW" = true ]; then
            brew install ffmpeg
            echo "FFMPEG=$(brew --prefix)/bin/ffmpeg" >> "$GITHUB_ENV"
            echo "FFPROBE=$(brew --prefix)/bin/ffprobe" >> "$GITHUB_ENV"
          fi

      # flutter-action's cache: true already covers the SDK and ~/.pub-cache.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Week stamp
        id: stamp
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # The derived data integration-ios.yml saves on main, under the same
      # keys; read here, never written.
      - name: Restore the Xcode derived data
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            derived-${{ env.FLUTTER_VERSION }}-${{
            hashFiles('app/ios/Podfile.lock') }}-${{ steps.stamp.outputs.week }}
          restore-keys: |
            derived-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/ios/Podfile.lock') }}-

      - name: Prepare the app package
        working-directory: app
        run: |
          flutter pub get
          dart run build_runner build
          flutter gen-l10n

      - name: Screenshots and slides
        working-directory: app
        env:
          LOCALES: ${{ inputs.locales }}
          # The runner's first build of the test app alone takes eight minutes.
          VELORKI_STORE_START_TIMEOUT: "1500"
        run: tool/store_screenshots.sh --locales "$LOCALES"

      - name: Preview video
        if: ${{ inputs.preview }}
        working-directory: app
        env:
          LOCALES: ${{ inputs.locales }}
          VELORKI_STORE_START_TIMEOUT: "1500"
        run: tool/store_screenshots.sh --preview --locales "$LOCALES"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-assets
          path: |
            app/build/store_screenshots/slides/set
            app/build/store_screenshots/watch
            app/build/store_screenshots/preview/*/preview*.mp4
            app/build/store_screenshots/preview/*/poster*.png
          if-no-files-found: error
          retention-days: 30

      - name: Mirror log
        if: failure()
        run: cat mirror.log || true

  upload:
    needs: assets
    if: ${{ inputs.upload && startsWith(github.ref, 'refs/tags/v') }}
    # macOS for sips, which the staging script uses.
    runs-on: macos-15
    timeout-minutes: 45
    # Required reviewer: nothing reaches App Store Connect before approval.
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store-assets
          path: ${{ runner.temp }}/assets

      - name: Stage the screenshots for deliver
        working-directory: app
        run: tool/store_stage_deliver.sh "$RUNNER_TEMP/assets" "$RUNNER_TEMP/screenshots"

      # The image's Ruby; the Gemfile pins fastlane to 2.x.
      - name: fastlane
        working-directory: app
        env:
          BUNDLE_PATH: ${{ runner.temp }}/bundle
        run: |
          ruby -v
          bundle install

      - name: Upload to App Store Connect
        working-directory: app
        env:
          BUNDLE_PATH: ${{ runner.temp }}/bundle
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APP_VERSION: ${{ inputs.app_version }}
          UPLOAD_METADATA: ${{ inputs.metadata }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "YES"
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          export SCREENSHOTS_PATH="$RUNNER_TEMP/screenshots"
          bundle exec fastlane ios store_assets

      - name: Remove the key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
