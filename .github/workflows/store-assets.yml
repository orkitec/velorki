name: store assets

# The App Store screenshots, the watch shots and the preview videos, made by
# app/tool/store_screenshots.sh on an iOS simulator exactly as on the Mac, and
# on request uploaded to an App Store version; and the Google Play set (`android`),
# made by the same script on an Android emulator, and on request uploaded to
# the Play store listing. Started by hand only; see docs/STORE_ASSETS.md.
#
# `assets` and `android` need no secrets and run from any ref. `upload` and
# `android_upload` run in the `release` environment, which admits `v*` tags
# and `main` and waits for the maintainer's approval. They replace the
# screenshots and, with `metadata`, the texts of every uploaded language (on
# that App Store version, on the Play listing); the preview video stays a
# manual upload. `assets_run_id` uploads the sets an earlier run captured
# instead of capturing again (artifacts are kept 30 days).
on:
  workflow_dispatch:
    inputs:
      locales:
        description: Languages, comma-separated
        type: string
        default: en,de
      ios:
        description: The App Store set (iOS simulator)
        type: boolean
        default: true
      # Off by default: on the runner's software renderer the map draws no
      # labels, icons or dashed lines, so the Play set for the store is made
      # on a Mac (docs/STORE_ASSETS.md).
      android:
        description: The Google Play set (map labels missing on the runner)
        type: boolean
        default: false
      # The runner's simulator has no GPU and drops frames of the moving map;
      # the preview for the store is recorded on a Mac (docs/STORE_ASSETS.md).
      preview:
        description: Also record the preview video (choppier than on a Mac)
        type: boolean
        default: false
      upload:
        description: Upload the chosen sets to App Store Connect / Google Play (from a v* tag or main)
        type: boolean
        default: false
      metadata:
        description: Also upload the store texts (fastlane/metadata/ios, /android)
        type: boolean
        default: false
      app_version:
        description: App Store version to put them on, e.g. 1.0.1 (needed to upload iOS)
        type: string
        default: ""
      assets_run_id:
        description: Upload the set of this earlier run instead of capturing (its run id)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: store-assets-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.4"  # keep in sync with mise.toml and app/.fvmrc

jobs:
  assets:
    if: ${{ inputs.ios && inputs.assets_run_id == '' }}
    runs-on: macos-15
    # Each language is its own capture with a simulator reboot, and the
    # preview records every language again.
    timeout-minutes: 240

    steps:
      # An upload that cannot happen should say so now, not after the capture.
      - name: Check the inputs
        if: ${{ inputs.upload }}
        env:
          APP_VERSION: ${{ inputs.app_version }}
          REF: ${{ github.ref }}
        run: |
          [ -n "$APP_VERSION" ] || { echo "::error::upload needs app_version"; exit 1; }
          case "$REF" in
            refs/tags/v* | refs/heads/main) ;;
            *) echo "::error::upload runs only from a v* tag or main, not $REF"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The image's default Xcode 16.4 cannot compile device_info_plus (an
      # iOS 17 NSProcessInfo selector); the app is built with Xcode 26 on the
      # Mac, so pick the newest 26 on the runner.
      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26.*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # The watch shots need a watchOS simulator runtime for that Xcode; the
      # image usually has one, and a download is a few GB when it has not.
      - name: watchOS simulator runtime
        run: |
          if xcrun simctl list runtimes | grep -q '^watchOS'; then
            xcrun simctl list runtimes | grep '^watchOS'
          else
            echo "::notice::no watchOS runtime on the image; downloading it"
            xcodebuild -downloadPlatform watchOS
            xcrun simctl list runtimes | grep '^watchOS' \
              || { echo "::error::still no watchOS simulator runtime"; exit 1; }
          fi

      # store_slides.py drives headless Chrome, which the image ships;
      # store_preview.py wants ffmpeg, which it does not.
      - name: Chrome and ffmpeg
        env:
          PREVIEW: ${{ inputs.preview }}
        run: |
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          [ -x "$chrome" ] || { echo "::error::no Google Chrome at $chrome"; exit 1; }
          "$chrome" --version
          if [ "$PREVIEW" = true ]; then
            brew install ffmpeg
            echo "FFMPEG=$(brew --prefix)/bin/ffmpeg" >> "$GITHUB_ENV"
            echo "FFPROBE=$(brew --prefix)/bin/ffprobe" >> "$GITHUB_ENV"
          fi

      # flutter-action's cache: true already covers the SDK and ~/.pub-cache.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: CocoaPods cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('app/ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Week stamp
        id: stamp
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # The derived data integration-ios.yml saves on main, under the same
      # keys; read here, never written.
      - name: Restore the Xcode derived data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: >-
            derived-${{ env.FLUTTER_VERSION }}-${{
            hashFiles('app/ios/Podfile.lock') }}-${{ steps.stamp.outputs.week }}
          restore-keys: |
            derived-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/ios/Podfile.lock') }}-

      - name: Prepare the app package
        working-directory: app
        run: |
          flutter pub get
          dart run build_runner build
          flutter gen-l10n

      - name: Screenshots and slides
        working-directory: app
        env:
          LOCALES: ${{ inputs.locales }}
          # The runner's first build of the test app alone takes eight minutes.
          VELORKI_STORE_START_TIMEOUT: "1500"
        run: tool/store_screenshots.sh --locales "$LOCALES"

      - name: Preview video
        if: ${{ inputs.preview }}
        working-directory: app
        env:
          LOCALES: ${{ inputs.locales }}
          VELORKI_STORE_START_TIMEOUT: "1500"
        run: tool/store_screenshots.sh --preview --locales "$LOCALES"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-assets
          path: |
            app/build/store_screenshots/slides/set
            app/build/store_screenshots/watch
            app/build/store_screenshots/preview/*/preview*.mp4
            app/build/store_screenshots/preview/*/poster*.png
          if-no-files-found: error
          retention-days: 30

      - name: Mirror log
        if: failure()
        run: cat mirror.log || true

  upload:
    needs: assets
    # After a capture in this run, or straight away with an earlier run's set.
    if: >-
      ${{ always() && inputs.ios && inputs.upload
      && (needs.assets.result == 'success'
      || (needs.assets.result == 'skipped' && inputs.assets_run_id != '')) }}
    # macOS for sips, which the staging script uses.
    runs-on: macos-15
    timeout-minutes: 45
    # Required reviewer: nothing reaches App Store Connect before approval.
    environment: release
    permissions:
      contents: read
      # An earlier run's artifact.
      actions: read

    steps:
      - name: Check the inputs
        env:
          APP_VERSION: ${{ inputs.app_version }}
          REF: ${{ github.ref }}
          RUN_ID: ${{ inputs.assets_run_id }}
        run: |
          [ -n "$APP_VERSION" ] || { echo "::error::upload needs app_version"; exit 1; }
          case "$REF" in
            refs/tags/v* | refs/heads/main) ;;
            *) echo "::error::upload runs only from a v* tag or main, not $REF"; exit 1 ;;
          esac
          if [ -n "$RUN_ID" ] && ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::assets_run_id must be a run id (digits), not '$RUN_ID'"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store-assets
          path: ${{ runner.temp }}/assets
          run-id: ${{ inputs.assets_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Stage the screenshots for deliver
        working-directory: app
        run: tool/store_stage_deliver.sh "$RUNNER_TEMP/assets" "$RUNNER_TEMP/screenshots"

      # The image's Ruby; the Gemfile pins fastlane to 2.x.
      - name: fastlane
        working-directory: app
        env:
          BUNDLE_PATH: ${{ runner.temp }}/bundle
        run: |
          ruby -v
          bundle install

      - name: Upload to App Store Connect
        working-directory: app
        env:
          BUNDLE_PATH: ${{ runner.temp }}/bundle
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APP_VERSION: ${{ inputs.app_version }}
          UPLOAD_METADATA: ${{ inputs.metadata }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "YES"
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$ASC_KEY_PATH"
          export SCREENSHOTS_PATH="$RUNNER_TEMP/screenshots"
          bundle exec fastlane ios store_assets

      - name: Remove the key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  # The Google Play set on the emulator integration.yml runs (API 35, Pixel 6
  # profile), with its system image step and, read only, its Gradle and AVD
  # caches.
  android:
    if: ${{ inputs.android && inputs.assets_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      API_LEVEL: "35"

    steps:
      - name: Check the inputs
        if: ${{ inputs.upload }}
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/tags/v* | refs/heads/main) ;;
            *) echo "::error::upload runs only from a v* tag or main, not $REF"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # store_slides.py drives headless Chrome, which the image ships. Ubuntu
      # keeps unprivileged user namespaces from AppArmor-confined programs,
      # which Chrome's sandbox needs.
      - name: Chrome
        run: |
          chrome="$(command -v google-chrome)"
          [ -n "$chrome" ] || { echo "::error::no google-chrome on the runner"; exit 1; }
          "$chrome" --version
          echo "CHROME=$chrome" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Restore the Gradle caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: >-
            gradle-itest-${{ env.API_LEVEL }}-${{
            hashFiles('app/android/**/*.gradle*', 'app/pubspec.lock') }}
          restore-keys: |
            gradle-itest-${{ env.API_LEVEL }}-

      - name: Prepare the app package
        working-directory: app
        run: |
          flutter pub get
          dart run build_runner build
          flutter gen-l10n

      # As in integration.yml: installed and checked here, so the emulator
      # action finds it in place.
      - name: Install the system image
        id: sysimg
        run: |
          sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          pkg="system-images;android-$API_LEVEL;google_apis;x86_64"
          dir="$sdk/system-images/android-$API_LEVEL/google_apis/x86_64"
          for try in 1 2 3; do
            printf 'y\n%.0s' {1..30} \
              | "$sdk/cmdline-tools/latest/bin/sdkmanager" --install "$pkg" || true
            if [ -s "$dir/system.img" ] && [ -f "$dir/package.xml" ]; then
              revision=$(sed -n 's/.*<major>\([0-9]*\)<\/major>.*/\1/p' "$dir/package.xml" | head -n 1)
              echo "revision=${revision:-0}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "==> $pkg did not install cleanly (try $try of 3); fetching it again"
            rm -rf "$dir" "$sdk/.temp"
            sleep 20
          done
          echo "::error::$pkg could not be installed"
          exit 1

      # integration.yml's AVD and snapshot, under its key; on a miss the
      # emulator action creates the AVD and boots it cold.
      - name: Restore the AVD
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-google_apis-pixel_6-r${{ steps.sysimg.outputs.revision }}

      - name: Screenshots and slides
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          LOCALES: ${{ inputs.locales }}
          VELORKI_STORE_START_TIMEOUT: "1500"
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          working-directory: app
          force-avd-creation: false
          # guest: Android renders in software itself. On the runner,
          # swiftshader_indirect is the old GLES translator, under which the
          # map draws no labels, icons or dashed lines (everything MapLibre
          # takes from a texture atlas), and swangle_indirect kills the
          # emulator half a minute into the capture. -no-snapshot:
          # integration.yml's snapshot was made under another renderer.
          emulator-options: >-
            -no-window -no-snapshot -no-audio -no-boot-anim
            -gpu guest -camera-back none -camera-front none
          disable-animations: true
          # One line: the action runs the script line by line.
          # The device log is kept for a failed run: the emulator is gone
          # once this step ends.
          script: tool/store_screenshots.sh --platform android --locales "$LOCALES" || { timeout 60 adb -s emulator-5554 logcat -d > build/logcat.txt; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-assets-android
          path: app/build/store_screenshots/android/slides/set
          if-no-files-found: error
          retention-days: 30

      - name: Mirror log
        if: failure()
        run: cat mirror.log || true

      - name: Device log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: store-assets-android-logcat
          path: app/build/logcat.txt
          if-no-files-found: ignore
          retention-days: 7

  android_upload:
    needs: android
    # After a capture in this run, or straight away with an earlier run's set.
    if: >-
      ${{ always() && inputs.android && inputs.upload
      && (needs.android.result == 'success'
      || (needs.android.result == 'skipped' && inputs.assets_run_id != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewer: nothing reaches Google Play before approval.
    environment: release
    permissions:
      contents: read
      # An earlier run's artifact.
      actions: read

    steps:
      - name: Check the inputs
        env:
          REF: ${{ github.ref }}
          RUN_ID: ${{ inputs.assets_run_id }}
        run: |
          case "$REF" in
            refs/tags/v* | refs/heads/main) ;;
            *) echo "::error::upload runs only from a v* tag or main, not $REF"; exit 1 ;;
          esac
          if [ -n "$RUN_ID" ] && ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::assets_run_id must be a run id (digits), not '$RUN_ID'"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store-assets-android
          path: ${{ runner.temp }}/assets
          run-id: ${{ inputs.assets_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Stage the listing for supply
        working-directory: app
        run: tool/store_stage_supply.sh "$RUNNER_TEMP/assets" "$RUNNER_TEMP/listing"

      # As in release.yml: the Ubuntu image has no Bundler on the PATH; the
      # Gemfile pins fastlane to 2.x.
      - name: fastlane
        working-directory: app
        env:
          BUNDLE_PATH: ${{ runner.temp }}/bundle
        run: |
          if ! command -v bundle > /dev/null; then
            if ! command -v ruby > /dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq ruby-full
            fi
            sudo gem install bundler --no-document
          fi
          ruby -v
          bundle install

      # The service account release.yml uploads the builds with.
      - name: Upload to Google Play
        working-directory: app
        env:
          BUNDLE_PATH: ${{ runner.temp }}/bundle
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          UPLOAD_METADATA: ${{ inputs.metadata }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_OPT_OUT_USAGE: "YES"
        run: |
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { echo "::error::no PLAY_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          export PLAY_SERVICE_ACCOUNT_JSON_PATH="$RUNNER_TEMP/play.json"
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > "$PLAY_SERVICE_ACCOUNT_JSON_PATH"
          export PLAY_METADATA_PATH="$RUNNER_TEMP/listing"
          bundle exec fastlane android store_listing

      - name: Remove the key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/play.json"
