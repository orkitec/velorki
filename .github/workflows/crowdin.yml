name: crowdin

# Translations are written in the repository, in the commit that changes the
# English (see CLAUDE.md), and go up to Crowdin as approved with the sources on
# every push to main; what people improve in Crowdin comes back once a week as
# a pull request on `l10n/crowdin`. Both need the
# CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN secrets; without them the jobs
# are skipped rather than shown green for doing nothing. Forks never talk to
# our project. What is translated is in `crowdin.yml`; the day-to-day is in
# docs/LOCALISATION.md.
on:
  push:
    branches: [main]
    paths:
      - "app/lib/l10n/app_*.arb"
      - "web/messages/*.json"
      - "web/content/**/*.md"
      - "app/fastlane/metadata/ios/*/*.txt"
      - "app/fastlane/metadata/android/*/*.txt"
      - "app/store/slides_*.json"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      upload_translations:
        description: >-
          Push the translations in the repository to Crowdin and approve
          them, also while a Crowdin pull request is open (its newer text is
          then overwritten).
        type: boolean
        default: false

# Read-only by default; only the `download` job writes a branch and a pull
# request.
permissions:
  contents: read

# Upload and download talk to the same Crowdin project, and a manual run with
# `upload_translations=false` would otherwise start both at once.
concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  token:
    if: ${{ github.repository_owner == 'orkitec' }}
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [ -n "$CROWDIN_PROJECT_ID" ] && [ -n "$CROWDIN_PERSONAL_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CROWDIN_PROJECT_ID / CROWDIN_PERSONAL_TOKEN are not set; Crowdin is not contacted."
          fi

  # Push to main that touched a source file, or a manual run.
  upload:
    needs: token
    if: ${{ needs.token.outputs.present == 'true' && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The repository's translations become the approved ones in Crowdin on
      # every push, and on a manual run with the box ticked. Not while a
      # Crowdin pull request is open: it holds newer text from Crowdin, which
      # the repository's older copy would overwrite. Merge it, and the next
      # push uploads.
      - id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          ASKED: ${{ inputs.upload_translations || false }}
        run: |
          translations=false
          if [ "$EVENT" = push ] || [ "$ASKED" = true ]; then
            translations=true
          fi
          if [ "$translations" = true ] && [ "$EVENT" = push ] &&
            [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --head l10n/crowdin --state open --json number --jq '.[].number')" ]; then
            echo "::warning::A Crowdin pull request is open; translations are not uploaded until it is merged."
            translations=false
          fi
          echo "translations=$translations" >> "$GITHUB_OUTPUT"
      - uses: crowdin/github-action@9c23991700c0ec5256fd41089b9d9d7d540e424e # v3.3.0
        with:
          upload_sources: true
          upload_translations: ${{ steps.mode.outputs.translations }}
          auto_approve_imported: ${{ steps.mode.outputs.translations }}
          import_eq_suggestions: ${{ steps.mode.outputs.translations }}
          download_translations: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  # Weekly, or a manual run that is not the one-off translation upload.
  # Translations never land on main without review.
  # The pull request cannot touch app_en.arb or messages/en.json: the
  # translation patterns in crowdin.yml resolve to a target language only, and
  # English is the source language of the project.
  download:
    needs: token
    if: ${{ needs.token.outputs.present == 'true' && github.event_name != 'push' && inputs.upload_translations != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Crowdin only downloads here; the pull request is opened below, after
      # the translated ARB files lose the "@key" metadata Crowdin copies into
      # them from app_en.arb (it has no setting against it, and gen-l10n
      # reads metadata from the English template only).
      - uses: crowdin/github-action@9c23991700c0ec5256fd41089b9d9d7d540e424e # v3.3.0
        with:
          upload_sources: false
          download_translations: true
          push_translations: false
          create_pull_request: false
          # A language nobody has started yet brings no half-empty file.
          skip_untranslated_files: true
          # Proofreading is not set up; a translated string is good enough.
          export_only_approved: false
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
      - name: Strip ARB metadata from the translations
        run: |
          # The action runs in a container and leaves root-owned files.
          sudo chown -R "$(id -u):$(id -g)" .
          for f in app/lib/l10n/app_*.arb; do
            [ "$f" = app/lib/l10n/app_en.arb ] && continue
            jq --indent 2 'with_entries(select(.key | test("^@[^@]") | not))' "$f" > "$f.tmp"
            mv "$f.tmp" "$f"
          done
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B l10n/crowdin
          git add -A
          if git diff --cached --quiet; then
            echo "No translation changes."
            exit 0
          fi
          git commit -m "Update translations from Crowdin"
          git push --force origin l10n/crowdin
          if [ -z "$(gh pr list --head l10n/crowdin --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head l10n/crowdin \
              --title "Update translations" \
              --body "Translations downloaded from Crowdin."
          fi
