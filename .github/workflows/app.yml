name: app

on:
  push:
    branches: [main]
    paths: ["app/**", "mise.toml", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "mise.toml", ".github/workflows/app.yml"]

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep in sync with mise.toml and app/.fvmrc
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-infos lib test integration_test
      - run: dart analyze --fatal-infos lib test integration_test
      - run: flutter test --coverage
      - name: Stage the BRouter oracle tiles (parity tests)
        # Offline: the rd5 tiles the corpus and the brouter_dart fixtures were
        # recorded against are committed in tools/brouter-oracle/tiles/, and
        # fetch.sh copies them into .cache/segments4 after checking them
        # against tiles.sha256. Fail loudly: a silently skipped parity suite is
        # worse than a red run.
        working-directory: tools/brouter-oracle
        run: |
          ./fetch.sh --tiles-only
          echo "BROUTER_SEGMENTS_DIR=$PWD/.cache/segments4" >> "$GITHUB_ENV"
      - name: package tests
        run: |
          for p in packages/*/; do
            echo "== $p"
            (cd "$p" && dart pub get && dart test)
          done
      - run: flutter build apk --debug --dart-define-from-file=env/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: velorki-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
