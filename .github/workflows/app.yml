name: app

on:
  push:
    branches: [main]
    paths: ["app/**", "mise.toml", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "mise.toml", ".github/workflows/app.yml"]

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep in sync with mise.toml and app/.fvmrc
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos lib test
      - run: dart analyze --fatal-infos lib test
      - run: flutter test --coverage
      - name: Cache the pinned BRouter oracle tiles
        uses: actions/cache@v4
        with:
          path: tools/brouter-oracle/.cache/segments4
          # The tiles are immutable release assets, so their content hash is the
          # whole key: a cache entry can never go stale, and bumping the snapshot
          # (a new tiles.sha256) misses the cache and re-downloads exactly once.
          key: brouter-oracle-tiles-${{ hashFiles('tools/brouter-oracle/tiles.sha256') }}
      - name: Fetch the BRouter oracle tiles (parity tests)
        # The tiles come from the immutable orkitec/velorki-data oracle-* release
        # that the corpus and the brouter_dart fixtures were recorded against, so
        # any failure here is a real problem, not the old nightly brouter.de
        # rebuild. Fail loudly: a silently skipped parity suite is worse than a
        # red run. --tiles-only keeps the job off the GitHub API entirely.
        working-directory: tools/brouter-oracle
        run: |
          ./fetch.sh --tiles-only
          echo "BROUTER_SEGMENTS_DIR=$PWD/.cache/segments4" >> "$GITHUB_ENV"
      - name: package tests
        run: |
          for p in packages/*/; do
            echo "== $p"
            (cd "$p" && dart pub get && dart test)
          done
      - run: flutter build apk --debug --dart-define-from-file=env/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: velorki-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
