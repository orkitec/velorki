name: app

# Every push and pull request: the static checks, the unit and widget tests and
# the package suites in `check`, and the debug APK in `apk` beside it. The two
# jobs are split because the APK build is the longest single step here and
# nothing in `check` needs it — run in parallel the workflow reports in about
# the time of its slower half.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/openapi.yaml"
      # The guide the app bundles (tool/gen.sh) and tests the links of.
      - "web/content/*/docs/**"
      - "tools/gazetteer/**"
      - "deploy/cloudflare/**"
      - "mise.toml"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "web/openapi.yaml"
      # The guide the app bundles (tool/gen.sh) and tests the links of.
      - "web/content/*/docs/**"
      - "tools/gazetteer/**"
      - "deploy/cloudflare/**"
      - "mise.toml"
      - ".github/workflows/app.yml"

# Nothing here writes anything back to the repository.
permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The store listing texts against each store's limits: seconds, so
      # before the toolchain rather than after the suites.
      - name: Store text lengths
        run: |
          python3 tool/store_text_check.py
          python3 -m unittest tool/store_text_check_test.py
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep in sync with mise.toml and app/.fvmrc
          cache: true
      - run: flutter pub get
      - run: bash tool/gen.sh
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze --fatal-infos lib test integration_test
      - run: dart analyze --fatal-infos lib test integration_test
      - name: Dead code (unused public code and files)
        run: bash tool/unused_code.sh
      - run: flutter test --coverage
      # The same widget suite in German. Every harness-built screen is
      # pumped in that locale, so a translation that no longer fits its
      # layout overflows or is cut off and fails here.
      - run: flutter test --dart-define=VELORKI_TEST_LOCALE=de
      - name: Stage the BRouter oracle tiles (parity tests)
        # Offline: the rd5 tiles the corpus and the brouter_dart fixtures were
        # recorded against are committed in tools/brouter-oracle/tiles/, and
        # fetch.sh copies them into .cache/segments4 after checking them
        # against tiles.sha256. Fail loudly: a silently skipped parity suite is
        # worse than a red run.
        working-directory: tools/brouter-oracle
        run: |
          ./fetch.sh --tiles-only
          echo "BROUTER_SEGMENTS_DIR=$PWD/.cache/segments4" >> "$GITHUB_ENV"
      - name: package tests
        run: |
          for p in packages/*/; do
            echo "== $p"
            (cd "$p" && dart pub get && dart test)
          done

  # The debug APK, for installing a push on a phone without building it. It
  # repeats the pub get / codegen preamble because it runs beside `check`
  # rather than after it; that costs about a minute and saves six.
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep in sync with mise.toml and app/.fvmrc
          cache: true
      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('app/android/**/*.gradle*', 'app/pubspec.lock') }}
          restore-keys: gradle-apk-
      - run: flutter pub get
      - run: bash tool/gen.sh
      - name: Install the NDK
        run: bash tool/install_ndk.sh

      - run: flutter build apk --debug --dart-define-from-file=env/ci.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velorki-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # The Google-free flavour, the one F-Droid publishes: tool/fdroid_strip.sh
  # takes the six closed-source plugins out of pubspec.yaml and patches the two
  # that ask Google Play Services for a location provider, and the build runs
  # from lib/main_fdroid.dart, whose Dart graph reaches none of them. The dex
  # scan at the end is the actual promise: zero Google, Play, Firebase, billing
  # or RevenueCat classes in the APK. See docs/FDROID.md.
  #
  # tool/fdroid_build.sh puts pubspec.yaml and pubspec.lock back afterwards
  # and keeps the patched plugins in a cache of its own; a job of its own all
  # the same, so nothing else ever builds beside a stripped tree.
  fdroid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep in sync with mise.toml and app/.fvmrc
          cache: true
      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-fdroid-${{ hashFiles('app/android/**/*.gradle*', 'app/pubspec.lock') }}
          restore-keys: gradle-fdroid-
      - run: flutter pub get
      # The generated code first: the strip script runs `pub get` again over
      # the smaller dependency set, and build_runner wants the full one.
      - run: bash tool/gen.sh
      - name: Install the NDK
        run: bash tool/install_ndk.sh
      # Strip, build from lib/main_fdroid.dart, dex-scan, restore: the same
      # script a laptop runs. Release, because that is what F-Droid publishes;
      # signed with the debug key here, which is all the scan needs.
      - name: Build the Google-free APK and scan its dex
        run: bash tool/fdroid_build.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: velorki-fdroid-apk
          path: app/build/fdroid/velorki-fdroid-release.apk
          retention-days: 7

  # The web planner: a build for the browser is the cheap guard against an
  # import that only the phones have (dart:ffi, a plugin without a web side)
  # reaching the web path; the index page's device gate and the tile function
  # have their own tests, run with Node's built-in runner.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep in sync with mise.toml and app/.fvmrc
          cache: true
      - name: Device gate and tile function tests
        working-directory: .
        run: node --test app/web_test/*.test.mjs deploy/cloudflare/test/*.test.mjs
      - run: flutter pub get
      - run: bash tool/gen.sh
      # The browser-only code (the file store in Cache Storage) in a real
      # Chrome, which the runner image has; about half a minute.
      - run: flutter test --platform chrome test/web/
      - run: bash tool/web_assets.sh
      - run: flutter build web --wasm --no-web-resources-cdn --dart-define-from-file=env/web.json

  # The gazetteer builder, which is Python and has nothing to do with the app
  # package -- hence the working-directory override. It builds the 3.5 MB
  # Liechtenstein extract twice and asserts the file format, the query contract
  # and the mirror tooling against it: 75 tests in about five seconds, so it
  # rides along on every run of this workflow rather than being gated on a
  # path. tools/gazetteer/** is in the paths above for the same reason the app
  # job wants it: app/test reads the committed .gaz fixtures.
  gazetteer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # pyosmium ships wheels per CPython version; 3.13 has them, and a
          # tool-cache Python takes pip installs without --break-system-packages.
          python-version: "3.13"
      - run: pip install "osmium>=4,<5"
      - name: Download the Geofabrik Liechtenstein extract
        # The builder tests read the source file name into meta.source and
        # assert on it, so the -latest name Geofabrik serves is dropped here.
        run: |
          curl --retry 3 --retry-all-errors --fail --location --silent --show-error \
            --user-agent "velorki-ci (+https://github.com/orkitec/velorki)" \
            --output "$RUNNER_TEMP/liechtenstein.osm.pbf" \
            https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf
      - name: Builder tests
        env:
          GAZ_EXTRACT: ${{ runner.temp }}/liechtenstein.osm.pbf
        run: python3 -m unittest tools/gazetteer/test_gazetteer.py
      - name: Validate the committed fixtures
        run: python3 tools/gazetteer/check.py tools/gazetteer/fixtures/*.gaz
      - name: Fixture checksums
        # The app tests and the emulator tile mirror are bound to these exact
        # bytes; a rebuild that changes them has to be deliberate.
        working-directory: tools/gazetteer/fixtures
        run: sha256sum -c fixtures.sha256
