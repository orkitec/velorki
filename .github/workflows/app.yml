name: app

on:
  push:
    branches: [main]
    paths: ["app/**", "mise.toml", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "mise.toml", ".github/workflows/app.yml"]

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4  # keep in sync with mise.toml and app/.fvmrc
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: flutter gen-l10n
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos lib test
      - run: dart analyze --fatal-infos lib test
      - run: flutter test --coverage
      - name: Fetch the BRouter oracle tiles (parity tests)
        # Exit 3 means brouter.de rebuilt the tiles since the corpus was
        # recorded; the tile-backed tests then skip instead of failing.
        working-directory: tools/brouter-oracle
        run: |
          if ./fetch.sh; then
            echo "BROUTER_SEGMENTS_DIR=$PWD/.cache/segments4" >> "$GITHUB_ENV"
          else
            echo "::warning::oracle tiles changed upstream; skipping tile-backed brouter_dart tests"
          fi
      - name: package tests
        run: |
          for p in packages/*/; do
            echo "== $p"
            (cd "$p" && dart pub get && dart test)
          done
      - run: flutter build apk --debug --dart-define-from-file=env/ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: velorki-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
