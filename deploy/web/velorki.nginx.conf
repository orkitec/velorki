# Velorki website + relay behind nginx: the TLS terminator in front of the
# Orkify cluster, for a box that already runs nginx for something else.
#
# This is the alternative to deploy/web/Caddyfile. Use it when the box is
# shared - the official one also serves Orkify's own site - and installing
# Caddy would mean two things fighting over 80 and 443. Runbook:
# docs/DEPLOY_WEB.md, step 4b.
#
#   sudo install -m 0644 deploy/web/velorki.nginx.conf \
#     /etc/nginx/sites-available/velorki
#   sudo ln -sfn /etc/nginx/sites-available/velorki \
#     /etc/nginx/sites-enabled/velorki
#   sudo /usr/local/bin/velorki-cloudflare-ips-nginx   # writes the real_ip file
#   sudo nginx -t && sudo systemctl reload nginx
#
# Three hostnames, one origin process on 127.0.0.1:8080:
#   velorki.com      the site, the docs, /s/<id> share pages
#   www.velorki.com  308 to the apex
#   api.velorki.com  the relay (OAuth exchange, /ai/plan, POST /share, /health)
#
# The port is not sacred: if 8080 is taken on this box, change it here AND in
# web/orkify.yml (`port:` and `env.PORT`). The two must agree or the health
# probe dials a closed socket.
#
# `proxy_set_header Host $host` is load-bearing. The app separates the site and
# the relay by the Host header (SITE_HOST / API_HOST); nginx's default is
# `Host: $proxy_host`, i.e. `127.0.0.1:8080`, which the app's host gate reads as
# the api role (that is how Orkify's header-less health probe reaches /health).
# Strip it and the site becomes unreachable while the relay answers on every
# hostname.
#
# TLS is a Cloudflare Origin CA certificate, not ACME: it is trusted by
# Cloudflare only, which is the only thing allowed to reach this box, and
# Cloudflare runs Full (strict) against it. One certificate per domain - the
# other site on this box has its own, under its own directory. A direct browser
# hit on the origin therefore shows a certificate error; that is the design.
#
# ---------------------------------------------------------------------------
# HTTP/2, and the one thing to check before reloading a SHARED nginx.
#
# `listen ... http2` is a parameter of the listening socket, not of this server
# block, and nginx deprecates it in favour of a per-server `http2 on;`
# (nginx 1.25.1+; a 1.24 box, e.g. stock Ubuntu 24.04, does not know that
# directive yet). Two consequences on a box that already serves another site
# from the same :443 socket:
#
#   * if the other site's block says plain `listen 443 ssl;`, nginx logs
#     "protocol options redefined for 0.0.0.0:443" and whichever block it read
#     first decides HTTP/2 for BOTH sites;
#   * if it already says `listen 443 ssl http2;`, the two agree and nothing is
#     redefined.
#
# So look before reloading:
#
#   nginx -v                                        # 1.25.1+ or not
#   grep -rn 'listen.*443' /etc/nginx/sites-enabled/
#
# On 1.25.1+ the clean answer is `listen 443 ssl;` here plus `http2 on;` inside
# each server block below - per server, so the neighbour is untouched. On 1.24
# match whatever the neighbour already does.
# ---------------------------------------------------------------------------

# ------------------------------------------------------------ shared bits ---
# Cloudflare's ranges, so $remote_addr is the real visitor rather than an edge
# node. Generated by deploy/web/cloudflare-ips-nginx.sh and refreshed by cron;
# it holds `set_real_ip_from <cidr>;` per range plus
# `real_ip_header CF-Connecting-IP;` and `real_ip_recursive on;`.
#
# On Debian/Ubuntu /etc/nginx/nginx.conf already globs conf.d/*.conf into the
# http block, so these directives are in force for every server on the box
# whether they are included here or not - including the other site's, though
# only for requests that actually arrive from a Cloudflare address. They are
# included per server block anyway: it keeps this file true on a box whose
# nginx.conf does not glob conf.d, and re-declaring the same list at server
# level is a no-op. To keep it off the neighbour entirely, generate it into
# /etc/nginx/snippets/ instead (SNIPPET=... on the script) and change the three
# include lines below to match; snippets/ is not globbed.
#
# The app does its own thing with the header: CLIENT_IP_HEADER=cf-connecting-ip
# with TRUST_PROXY=1 (deploy/web/velorki-web.env.example) means the rate limiter
# keys on `CF-Connecting-IP` as it arrives at Node. nginx must therefore NOT
# strip or rename it. It does not by default - unknown request headers are
# passed through untouched - and the `proxy_set_header CF-Connecting-IP
# $remote_addr` below makes it explicit: what reaches the app is the value
# real_ip already validated came from a Cloudflare address, so a direct caller
# spoofing the header overwrites it with its own peer address instead.

# ------------------------------------------------------------------- :80 ----
# Harmless behind Cloudflare, which is told to always use HTTPS, but a plain
# request that does reach the box should not be a connection reset.
server {
    listen 80;
    listen [::]:80;
    server_name velorki.com www.velorki.com api.velorki.com;

    # No ACME challenge location: the certificate is Cloudflare's Origin CA,
    # issued by hand. Nothing here ever talks to Let's Encrypt.
    return 301 https://$host$request_uri;
}

# ----------------------------------------------------------------- apex ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name velorki.com;

    ssl_certificate     /etc/ssl/velorki/velorki.com.pem;
    ssl_certificate_key /etc/ssl/velorki/velorki.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:velorki_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/cloudflare-real-ip.conf;

    access_log /var/log/nginx/velorki-site.access.log;
    error_log  /var/log/nginx/velorki-site.error.log;

    # The site takes no uploads; nginx's 1m default is already generous.
    client_max_body_size 1m;

    # No `add_header` anywhere in this file. Next.js sends the whole security
    # header set itself (content-security-policy, x-frame-options,
    # referrer-policy, permissions-policy, x-content-type-options - see
    # web/next.config.ts) and a second copy of any of them from nginx would be
    # a duplicate header, which browsers resolve by taking the strictest CSP
    # and which breaks nothing but is a lie in the config.
    #
    # /_next/static needs no cache rule either: Next already answers those with
    # `cache-control: public, max-age=31536000, immutable`, so an `expires max`
    # or an `add_header Cache-Control` here would either overwrite an identical
    # value or emit a second one. Deliberately left out - checked against
    # web/next.config.ts and web/src/proxy.ts, whose matcher excludes
    # `_next/static` entirely.

    location / {
        proxy_pass http://127.0.0.1:8080;

        # The app routes by Host. Without this nginx sends 127.0.0.1:8080.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # $remote_addr is post-real_ip, i.e. Cloudflare's CF-Connecting-IP
        # value, and only when the connection came from a Cloudflare range.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header CF-Connecting-IP  $remote_addr;

        # Explicit because nginx speaks HTTP/1.0 upstream by default on
        # anything before 1.29.7, and 1.0 has no chunked framing and no
        # keep-alive - both of which the api host's event stream needs.
        proxy_http_version 1.1;
        # Empty, not "upgrade": keeps the upstream connection reusable and
        # stops a client's own Connection header from being forwarded.
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
    }
}

# ------------------------------------------------------------------ www ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.velorki.com;

    ssl_certificate     /etc/ssl/velorki/velorki.com.pem;
    ssl_certificate_key /etc/ssl/velorki/velorki.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:velorki_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/cloudflare-real-ip.conf;

    access_log /var/log/nginx/velorki-site.access.log;
    error_log  /var/log/nginx/velorki-site.error.log;

    # One canonical origin for the site, the share links and the CSP. 308 keeps
    # the method and the body, which matters for nothing here but costs
    # nothing. No proxy_pass: the app never sees a www request.
    return 308 https://velorki.com$request_uri;
}

# ------------------------------------------------------------------ api ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.velorki.com;

    ssl_certificate     /etc/ssl/velorki/velorki.com.pem;
    ssl_certificate_key /etc/ssl/velorki/velorki.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:velorki_tls:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/cloudflare-real-ip.conf;

    access_log /var/log/nginx/velorki-api.access.log;
    error_log  /var/log/nginx/velorki-api.error.log;

    # Hard ceiling in front of the app's own limits (1 MB default, 3 MB for
    # POST /share). nginx answers 413 before a byte reaches Node.
    client_max_body_size 4m;

    # POST /ai/plan is a Server-Sent Events stream. gzip would sit on it: the
    # compressor holds bytes back until it has a block worth flushing, which is
    # exactly the buffering an event stream cannot have. The other responses on
    # this host are small JSON, so nothing is lost.
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header CF-Connecting-IP  $remote_addr;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;

        # --- Server-Sent Events ------------------------------------------
        # Everything below exists for POST /ai/plan, which streams for
        # minutes. The defaults are all wrong for it:
        #   proxy_buffering on     - nginx would hold the stream in 4k/8k
        #                            buffers and release it in lumps, so the
        #                            client sees the plan arrive in bursts or
        #                            not until the end.
        #   proxy_read_timeout 60s - the app writes a `: ping` comment every
        #                            20 s (which is also what keeps Cloudflare
        #                            from dropping the connection at 100 s), so
        #                            60 s would not actually fire; 3600s is the
        #                            ceiling for a stream that stalls upstream.
        #   proxy_cache            - off by default, named here so switching on
        #                            a zone elsewhere in nginx.conf cannot
        #                            start caching a token exchange.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}

# --- Authenticated Origin Pulls (optional, see docs/DEPLOY_WEB.md step 5) ---
# Makes Cloudflare prove it is Cloudflare with a client certificate, so the
# origin is unreachable even if someone learns its address and spoofs a range.
# Download the CA once (the URL is one line, do not wrap it):
#   sudo curl -fsSL -o /etc/ssl/velorki/cloudflare-origin-pull-ca.pem \
#     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem
# then enable "Authenticated Origin Pulls" in the Cloudflare dashboard FIRST
# (or the first reload locks the site out) and add these two lines to EACH of
# the three :443 server blocks above:
#
#   ssl_client_certificate /etc/ssl/velorki/cloudflare-origin-pull-ca.pem;
#   ssl_verify_client on;
#
# The other site on this box is unaffected: both directives are per server.
