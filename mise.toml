# Toolchain pins for contributors using mise (https://mise.jdx.dev).
# Flutter also reads app/.fvmrc for fvm users; keep both in sync.
[tools]
flutter = "3.47.4"  # also pinned in .github/workflows/*.yml and app/.fvmrc
java = "temurin-21.0.12+101.0.LTS"
node = "26"

[env]
ANDROID_HOME = "{% if os() == 'macos' %}{{env.HOME}}/Library/Android/sdk{% else %}{{env.HOME}}/Android/Sdk{% endif %}"
ANDROID_SDK_ROOT = "{% if os() == 'macos' %}{{env.HOME}}/Library/Android/sdk{% else %}{{env.HOME}}/Android/Sdk{% endif %}"
