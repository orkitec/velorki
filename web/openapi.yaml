# SPDX-License-Identifier: AGPL-3.0-only
openapi: 3.1.0

info:
  title: Velorki API
  version: 1.0.0
  summary: Relay service for the Velorki bike app.
  description: |
    The Velorki app is open source and therefore cannot hold client secrets.
    This service keeps them: it relays OAuth token exchanges to Strava and
    Ride with GPS, wraps the tokens so the phone never holds one in clear,
    passes the app's service calls through with the token unwrapped in
    memory, verifies entitlements against RevenueCat, proxies route planning
    to a language model, and hosts share links.

    All errors share one body shape:

    ```json
    { "error": { "code": "invalid_request", "message": "...", "retry_after_s": 30 } }
    ```

    Every response carries `X-Request-Id`, echoing the request header when one
    was supplied and generated otherwise. Clients should send
    `X-Velorki-Client` (e.g. `android/1.0.0+1`); it is logged when present.

    Rate limits are **fixed windows** shared by every worker of the cluster:
    a limit of "10 per minute" allows 10 requests inside one wall-clock minute
    and resets at its boundary, with no burst credit carried over. A rejected
    request answers 429 with `retry_after_s` in the body and a `Retry-After`
    header, both being the number of seconds left in the window that rejected
    it. (The Fastify relay this service replaced used per-process token
    buckets; the numbers are unchanged, the refill behaviour is not.)

    On `POST /share`, `POST /ai/plan` and `POST /weather` the per-IP limit is
    charged **before the body is read**, so an over-limit caller gets 429
    rather than having a megabyte buffered for it. A malformed body from such
    a caller therefore answers 429, not 400.

    The API is served on `api.velorki.com` only. Share links live on
    `velorki.com`; a request for `/s/<id>` on the api host answers 308 to the
    site host, and any other unknown (method, path) pair on the api host
    answers 404 `not_found`.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only

servers:
  - url: https://api.velorki.com
    description: Production (the API host)
  - url: https://velorki.com
    description: Production (the site host; serves /s/{id} and /s/{id}.gpx only)
  - url: http://localhost:3000
    description: |
      Local development. With DEV_HOSTS=1 the api role is reached at
      api.localhost:3000, under the /__api prefix, or with the header
      `X-Velorki-Host: api`; the site role, share pages included, is the
      default for localhost.

tags:
  - name: health
    description: Liveness and configuration.
  - name: oauth
    description: |
      Token exchange with third-party services. The tokens in every answer are
      **wrapped**: AES-256-GCM under a key only this service has, in the form
      `v1.<kid>.<nonce>.<ciphertext>` (base64url). The app stores them as they
      are and sends them back through the pass-through routes; it can neither
      read nor use them on its own.
  - name: proxy
    description: |
      Pass-through to Strava and Ride with GPS. The path after
      `/proxy/<service>` is the upstream path; the wrapped access token comes
      in `X-Velorki-Token`, goes upstream as `Authorization: Bearer` and is
      forgotten when the answer has been streamed back with its own status.
      Only the calls the app makes are forwarded (the list is in
      `src/server/passthrough.ts`); any other method or path answers 404.
      Rate limit: 60 per minute and 1500 per day, per rider.
  - name: ai
    description: Language-model assisted route planning.
  - name: share
    description: |
      Public share links for routes and rides. `POST /share` is on the API
      host; the two public paths below are served by `velorki.com`.
  - name: weather
    description: |
      Hourly forecasts along a route, from public weather services: the US
      National Weather Service in the US, the Deutscher Wetterdienst (through
      Bright Sky) in and around Germany, MET Norway everywhere else and as the
      fallback whenever one of those fails.

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness and integration status.
      description: |
        Unauthenticated. Returns 200 whenever the process is running; every
        field after `version` describes an integration, not liveness - whether
        it has what it needs, never a value. Secrets are write-only where they
        are stored, so this is how a deploy is checked from outside; the boot
        log adds a sha256 fingerprint of each set secret.

        The BRouter probe is a short trekking query cached for 60 seconds with
        a 3 second timeout.
      security: []
      responses:
        '200':
          description: The service is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [status, version, brouter, llm, llm_model, strava, rwgps, entitlement, token_wrap]
                additionalProperties: false
                properties:
                  status:
                    type: string
                    const: ok
                  version:
                    type: string
                    description: The APP_VERSION environment variable, or "dev".
                    examples: ['1.4.2', 'dev']
                  brouter:
                    type: string
                    enum: [ok, degraded, unconfigured]
                  llm:
                    type: string
                    enum: [configured, unconfigured]
                  llm_model:
                    type: [string, 'null']
                    description: The model id when an LLM is configured.
                  strava:
                    type: string
                    enum: [configured, unconfigured]
                  rwgps:
                    type: string
                    enum: [configured, unconfigured]
                  entitlement:
                    type: string
                    enum: [live, stub, unconfigured]
                    description: |
                      `live` verifies against RevenueCat, `stub` lets everyone
                      through (development only), `unconfigured` is live mode
                      without a secret key and refuses every Plus request.
                  token_wrap:
                    type: string
                    enum: [configured, unconfigured]
              examples:
                configured:
                  value:
                    status: ok
                    version: '1.4.2'
                    brouter: ok
                    llm: configured
                    llm_model: z-ai/glm-5.3-flash
                    strava: configured
                    rwgps: configured
                    entitlement: live
                    token_wrap: configured

  /oauth/strava/token:
    post:
      tags: [oauth]
      operationId: stravaToken
      summary: Exchange a Strava authorization code for tokens.
      description: |
        Adds `client_id` and `client_secret` and posts the form-encoded
        exchange to `https://www.strava.com/oauth/token` with
        `grant_type=authorization_code`. Strava's JSON is returned unchanged,
        with its status code, on success.

        `redirect_uri` must match one entry of `OAUTH_REDIRECT_ALLOWLIST`
        exactly; prefixes and wildcards are not accepted.

        Rate limit: 10 per minute and 60 per day, per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/OAuthTokenPassthrough'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/NotEntitled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /oauth/strava/refresh:
    post:
      tags: [oauth]
      operationId: stravaRefresh
      summary: Refresh a Strava access token.
      description: |
        Posts `grant_type=refresh_token` to Strava and returns the answer
        unchanged. Rate limit: 30 per hour, per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRefreshRequest'
      responses:
        '200':
          $ref: '#/components/responses/OAuthTokenPassthrough'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/NotEntitled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /oauth/rwgps/token:
    post:
      tags: [oauth]
      operationId: rwgpsToken
      summary: Exchange a Ride with GPS authorization code for a token.
      description: |
        Posts `client_id`, `client_secret`, `code`, `redirect_uri` and
        `grant_type=authorization_code` to
        `https://ridewithgps.com/oauth/token.json` and returns the answer
        unchanged. `redirect_uri` must be on `OAUTH_REDIRECT_ALLOWLIST`.

        Rate limit: 10 per minute and 60 per day, per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/OAuthTokenPassthrough'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/NotEntitled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /oauth/rwgps/refresh:
    post:
      tags: [oauth]
      operationId: rwgpsRefresh
      summary: Not implemented.
      description: |
        Ride with GPS access tokens do not expire, so there is nothing to
        refresh. Always answers 501 with the error code `unavailable`; the
        route exists so the app receives a structured answer rather than a 404.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRefreshRequest'
      responses:
        '401':
          $ref: '#/components/responses/NotEntitled'
        '501':
          description: Not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notImplemented:
                  value:
                    error:
                      code: unavailable
                      message: >-
                        Ride with GPS does not support refresh tokens;
                        re-authorize instead.

  /proxy/strava/{path}:
    parameters:
      - $ref: '#/components/parameters/UpstreamPath'
      - $ref: '#/components/parameters/WrappedToken'
    get:
      tags: [proxy]
      operationId: stravaProxyGet
      summary: Forward a GET to Strava.
      description: |
        Allowed: `/api/v3/uploads/{id}`, `/api/v3/athletes/{id}/routes`,
        `/api/v3/routes/{id}/export_gpx`. The query string is forwarded
        (`access_token` is dropped).
      responses:
        '2XX':
          $ref: '#/components/responses/UpstreamPassthrough'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/NotEntitled'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [proxy]
      operationId: stravaProxyPost
      summary: Forward a POST to Strava.
      description: |
        Allowed: `/api/v3/uploads` (multipart, streamed, at most 25 MB) and
        `/oauth/deauthorize`. `Content-Type`, `Content-Length` and `Accept`
        go upstream; nothing else does.
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        '2XX':
          $ref: '#/components/responses/UpstreamPassthrough'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/NotEntitled'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /proxy/rwgps/{path}:
    parameters:
      - $ref: '#/components/parameters/UpstreamPath'
      - $ref: '#/components/parameters/WrappedToken'
    get:
      tags: [proxy]
      operationId: rwgpsProxyGet
      summary: Forward a GET to Ride with GPS.
      description: |
        Allowed: `/api/v1/users/current.json`, `/api/v1/routes.json`,
        `/api/v1/trips.json`, `/api/v1/tasks/{id}.json`,
        `/api/v1/routes/{id}.gpx`.
      responses:
        '2XX':
          $ref: '#/components/responses/UpstreamPassthrough'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/NotEntitled'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      tags: [proxy]
      operationId: rwgpsProxyPost
      summary: Forward a POST to Ride with GPS.
      description: |
        Allowed: `/api/v1/routes.json` and `/api/v1/trips.json` (multipart,
        streamed, at most 25 MB), and `/oauth/revoke.json`, where the relay
        writes the body itself from its client id, client secret and the
        unwrapped token and ignores the request's; 503 `unavailable` when
        Ride with GPS is not configured.
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        '2XX':
          $ref: '#/components/responses/UpstreamPassthrough'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/NotEntitled'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/UpstreamError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /ai/plan:
    post:
      tags: [ai]
      operationId: aiPlan
      summary: Plan, describe or ask about a route, as a Server-Sent Events stream.
      description: |
        Requires `X-AI-Consent: 1` on every request; there is no server-side
        memory of consent. Without it the request is rejected with 403
        `consent_required`.

        `step=plan` runs a single non-streaming model call forced to answer
        with one `propose_route` tool call, whose validated arguments are
        emitted as the `route_request` event. `step=describe` streams a 60-90
        word description of an already computed route as `text` events.
        `step=route` answers the rider's question (`prompt`) about the route
        on their map: a single non-streaming call forced to answer with one
        `advise_route` tool call, emitted as the `route_advice` event. It
        requires `route_summary.digest`. Every `place_id` in the answer must be
        a place of that digest and every kilometre mark must lie between 0 and
        `route_summary.distance_km`; an answer that breaks either is asked for
        once more and then reported as an `error` event, like a missed tool
        call.

        The prompt never contains the `app_user_id`. `context.start` is rounded
        to two decimals server-side.

        Rate limits: 60 per hour per IP, charged before the body is read, then
        20 per hour and 100 per day per app user, all as fixed windows. A
        global daily spend budget (`LLM_DAILY_BUDGET_USD`), counted across the
        cluster, answers 503 `unavailable` once exceeded.

        The stream opens with a `: open` comment frame and carries a `: ping`
        comment every 20 seconds so an intermediary cannot idle it out.

        Errors detected before the stream opens are ordinary JSON error
        responses. Once the stream is open the status is already 200, so
        failures arrive as an `error` event carrying the same error body.
      parameters:
        - $ref: '#/components/parameters/AiConsent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
            examples:
              plan:
                summary: step=plan
                value:
                  step: plan
                  locale: de-CH
                  units: metric
                  prompt: Eine hügelige Runde von etwa 65 km mit einem Kaffeehalt.
                  context:
                    start: { lat: 47.38, lon: 8.54 }
                    start_label: Zürich
                    today: '2026-09-12'
              describe:
                summary: step=describe
                value:
                  step: describe
                  locale: de-CH
                  units: metric
                  prompt: Beschreibe diese Route.
                  route_summary:
                    distance_km: 64.2
                    ascent_m: 810
                    surface: { paved: 0.8, gravel: 0.2 }
                    waypoints: [Uetliberg, Albispass]
                    highlights: [Aussicht über den Zürichsee]
              describe_with_digest:
                summary: step=describe with the route digest
                value:
                  step: describe
                  locale: en
                  units: metric
                  prompt: Funchal to Machico
                  route_summary:
                    distance_km: 29.24
                    ascent_m: 1046
                    surface: { paved: 0.9, unpaved: 0.1 }
                    digest:
                      profile: trekking
                      loop: false
                      stretches:
                        - from_km: 0
                          to_km: 2.6
                          road: tertiary
                          surface: asphalt
                          avg_grade: 6.1
                          max_grade: 14.8
                          start: { lat: 32.64751, lon: -16.90872 }
                          end: { lat: 32.65012, lon: -16.88431 }
                      climbs:
                        - { start_km: 0.8, length_km: 2.1, gain_m: 145, avg_grade: 6.8, max_grade: 14.8 }
                      towns:
                        - { name: Caniço, kind: city, km: 9.5, lat: 32.65231, lon: -16.85127 }
                      places:
                        - { id: p1, kind: cafe, name: Americana, km: 1.5, off_m: 6, lat: 32.64881, lon: -16.89567 }
              route:
                summary: step=route, a question about the route on the map
                value:
                  step: route
                  locale: en
                  units: metric
                  prompt: Where can I get a coffee around halfway?
                  route_summary:
                    distance_km: 29.24
                    ascent_m: 1046
                    surface: { paved: 0.9, unpaved: 0.1 }
                    digest:
                      profile: trekking
                      loop: false
                      stretches:
                        - from_km: 0
                          to_km: 2.6
                          road: tertiary
                          surface: asphalt
                          avg_grade: 6.1
                          max_grade: 14.8
                          start: { lat: 32.64751, lon: -16.90872 }
                          end: { lat: 32.65012, lon: -16.88431 }
                      towns:
                        - { name: Caniço, kind: city, km: 9.5, lat: 32.65231, lon: -16.85127 }
                      places:
                        - { id: p1, kind: cafe, name: Americana, km: 14.2, off_m: 6, lat: 32.64881, lon: -16.89567 }
      responses:
        '200':
          description: |
            An SSE stream. Event names and their `data` payloads:

            | event | data | when |
            | --- | --- | --- |
            | `route_request` | the validated `propose_route` arguments | once, `step=plan` |
            | `text` | `{ "delta": "..." }` | repeatedly, `step=describe` |
            | `route_advice` | the validated `advise_route` arguments (`RouteAdvice`) | once, `step=route` |
            | `done` | `{ "usage": { "in": 0, "out": 0 }, "model": "..." }` | last event on success |
            | `error` | an error body | instead of `done` on failure |

            A successful stream always ends with `done`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                plan:
                  summary: step=plan
                  value: |
                    : open

                    event: route_request
                    data: {"distance_km":65,"loop":true,"start":{"use_current":true},"via":["Uetliberg"],"surface":"mixed","hills":"seek","traffic_tolerance":"low","stops":["cafe"],"profile_hint":"trekking","notes":"Hügelige Runde ab deinem Standort.","confidence":0.8}

                    event: done
                    data: {"usage":{"in":412,"out":96},"model":"some-model"}

                describe:
                  summary: step=describe
                  value: |
                    : open

                    event: text
                    data: {"delta":"Diese Runde führt "}

                    event: done
                    data: {"usage":{"in":300,"out":110},"model":"some-model"}

                route:
                  summary: step=route
                  value: |
                    : open

                    event: route_advice
                    data: {"answer":"Americana, a café right by the road at 14.2 km, is about halfway.","findings":[{"kind":"food","place_id":"p1","text":"Americana, a café 6 m off the route.","fix":{"type":"add_stop","place_id":"p1"}}]}

                    event: done
                    data: {"usage":{"in":980,"out":120},"model":"some-model"}

                failure:
                  summary: the model produced unusable arguments
                  value: |
                    : open

                    event: error
                    data: {"error":{"code":"invalid_request","message":"The proposed route was not usable: distance_km Too small: expected number to be >=5"}}
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/NotEntitled'
        '403':
          $ref: '#/components/responses/ConsentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /share:
    post:
      tags: [share]
      operationId: createShare
      summary: Store a route or ride and return a public link.
      description: |
        The GPX is stored verbatim, together with a small summary, under a
        random 10-character base62 id. Shares expire after 365 days and a daily
        sweep removes expired rows. Nothing links the row to the rider who
        created it.

        Rate limits: 60 per hour per IP, charged before the body is read, then
        30 per day per app user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequest'
      responses:
        '201':
          description: The share was created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [id, url]
                additionalProperties: false
                properties:
                  id:
                    type: string
                    pattern: '^[A-Za-z0-9]{10}$'
                  url:
                    type: string
                    format: uri
              examples:
                created:
                  value:
                    id: 7Kq2mZ0aTb
                    url: https://velorki.com/s/7Kq2mZ0aTb
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/NotEntitled'
        '429':
          $ref: '#/components/responses/RateLimited'

  /weather:
    post:
      tags: [weather]
      operationId: getWeather
      summary: Hourly forecasts for a list of grid cells.
      description: |
        The app snaps every point it asks about to a 0.025° grid (about 2.5 km)
        and its altitude to 50 m before sending it, so no precise position
        leaves the phone; a coordinate with more than three decimals is
        refused with 400 `invalid_request` rather than rounded. Nothing in a
        request is logged but counts.

        `cells[i]` of the answer answers `cells[i]` of the request: same order,
        same length. Each carries one entry per full UTC hour from the hour at
        or before `from`, for `hours` hours, leaving out the hours its source
        does not forecast (past its horizon, or before its first step). Where
        MET Norway steps six-hourly, the instant values are interpolated
        linearly to the hour and the six hours' precipitation is split evenly;
        nothing is extrapolated past its last step.

        Each cell is answered by the first source whose area covers it: `nws`
        in the US (contiguous states, Alaska, Hawaii, Puerto Rico), `dwd` from
        45.8° to 55.1° N and 5.8° to 17.2° E where a forecast station lies
        within 25 km, `metno` everywhere else. A cell whose source fails, or
        has no hour in the window, is asked of `metno`. A cell no source
        answered has `source: null` and no hours; the request still succeeds
        unless that is every cell, which is 502 `upstream_error`.

        `sources` lists, once each, the sources the answer used, with the
        attribution the app shows beside the data.

        Forecasts are cached across the cluster: an hour per NWS grid and DWD
        station, and until MET's `Expires` (10 minutes to 2 hours) per MET
        point. Asking again within that costs no upstream call.

        Rate limits: 120 per hour per IP, charged before the body is read,
        then 60 per hour and 400 per day per app user. 503 `unavailable` when
        weather is switched off on this server (`WEATHER_PROVIDERS=none`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WeatherRequest'
            examples:
              berlinAndTokyo:
                value:
                  from: '2026-10-11T06:00:00Z'
                  hours: 2
                  cells:
                    - { lat: 52.525, lon: 13.4, alt: 50 }
                    - { lat: 35.675, lon: 139.7, alt: 50 }
      responses:
        '200':
          description: One forecast per requested cell, in request order.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeatherResponse'
              examples:
                answered:
                  value:
                    cells:
