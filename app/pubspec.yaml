name: velorki
description: Plan and ride bike routes. Free, open source, built on OpenStreetMap.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  app_links: ^7.2.1
  dio: ^5.11.1
  drift: ^2.35.0
  file_picker: ^12.3.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.1
  flutter_tts: ^4.2.5
  flutter_web_auth_2: ^5.1.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^18.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logging: ^1.3.0
  maplibre_gl: ^0.27.1
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  receive_sharing_intent: ^1.9.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  universal_ble: ^2.3.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  # Workspace members, resolved from packages/ (no version constraint).
  velorki_api:
  velorki_brouter:
  velorki_loops:
  velorki_fit:
  velorki_geo:
  velorki_gpx:
  velorki_tcx:
  wakelock_plus: ^1.8.0
  purchases_flutter: ^10.12.0
  sensors_plus: ^7.1.0
  screen_brightness: ^2.1.11
  live_activities: ^2.6.0
  health: ^13.3.2
  watch_connectivity: ^0.2.10

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  # Ships with flutter_test; named here because the tests import it directly.
  fake_async: ^1.3.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  # riverpod_lint is not a dev_dependency: since 3.1 it is an
  # analysis_server_plugin, declared under `plugins:` in analysis_options.yaml.

flutter:
  uses-material-design: true
  generate: true
  assets:
    # 1.5 s of silence, played on iOS just before a spoken turn cue so a
    # Bluetooth headset is awake by the time the voice starts. See
    # assets/audio/README.md.
    - assets/audio/silence.wav
    # The pinned BRouter release's routing profiles and tag lookup table.
    # BrouterAssets copies them to <appSupport>/brouter/profiles/ at startup,
    # because the on-device engine reads them as files, not as assets.
    # UPSTREAM_VERSION is the copy marker; keep both in step with brouter/.
    - assets/brouter/UPSTREAM_VERSION
    - assets/brouter/profiles/
    # Strava's official brand assets, unmodified apart from proportional
    # scaling of the vector originals. The 2.0x and 3.0x variants next to
    # them are picked up automatically. See assets/strava/README.md.
    - assets/strava/btn_strava_connect_with_orange.png
    - assets/strava/btn_strava_connect_with_white.png
    - assets/strava/api_logo_pwrdBy_strava_horiz_orange.png
    - assets/strava/api_logo_pwrdBy_strava_horiz_white.png
    # Friendly names for the phone's text-to-speech voices. Built by
    # tool/fetch_voices.py; see assets/voices/README.md.
    - assets/voices/catalogue.json

  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700

# Launcher icons. The PNGs are generated from the SVG sources next to them
# (see assets/icon/README.md); `dart run flutter_launcher_icons` then writes
# the Android mipmaps and the iOS AppIcon set.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  # The volt accent's light tone, the colour of the light icon tile.
  adaptive_icon_background: "#3F7A00"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  # Android 13 themed icons: the glyph alone, recoloured by the launcher.
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  # App Store rejects an icon with an alpha channel.
  remove_alpha_ios: true
  min_sdk_android: 26

# Dart pub workspace: the pure-Dart packages resolve together with the app.
workspace:
  - packages/velorki_geo
  - packages/velorki_gpx
  - packages/velorki_fit
  - packages/velorki_tcx
  - packages/velorki_brouter
  - packages/velorki_loops
  - packages/velorki_api
  - packages/brouter_dart

