name: velorki
description: Plan and ride bike routes. Free, open source, built on OpenStreetMap.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  dio: ^5.11.1
  drift: ^2.35.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logging: ^1.3.0
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  uuid: ^4.6.0
  # Workspace member, resolved from packages/velorki_geo (no version constraint).
  velorki_geo:

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  # riverpod_lint is not a dev_dependency: since 3.1 it is an
  # analysis_server_plugin, declared under `plugins:` in analysis_options.yaml.

flutter:
  uses-material-design: true
  generate: true

# Dart pub workspace: the pure-Dart packages resolve together with the app.
workspace:
  - packages/velorki_geo
  - packages/velorki_gpx
  - packages/velorki_fit
  - packages/velorki_brouter
  - packages/velorki_loops
  - packages/velorki_api
  - packages/brouter_dart
