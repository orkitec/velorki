name: velorki
description: Plan and ride bike routes. Free, open source, built on OpenStreetMap.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  app_links: ^7.2.1
  dio: ^5.11.1
  drift: ^2.35.0
  file_picker: ^12.3.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.1.1
  flutter_web_auth_2: ^5.1.0
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^18.0.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  logging: ^1.3.0
  maplibre_gl: ^0.27.1
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  receive_sharing_intent: ^1.9.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.2
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  # Workspace members, resolved from packages/ (no version constraint).
  velorki_api:
  velorki_brouter:
  velorki_loops:
  velorki_fit:
  velorki_geo:
  velorki_gpx:
  wakelock_plus: ^1.8.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  # riverpod_lint is not a dev_dependency: since 3.1 it is an
  # analysis_server_plugin, declared under `plugins:` in analysis_options.yaml.

flutter:
  uses-material-design: true
  generate: true

# Dart pub workspace: the pure-Dart packages resolve together with the app.
workspace:
  - packages/velorki_geo
  - packages/velorki_gpx
  - packages/velorki_fit
  - packages/velorki_brouter
  - packages/velorki_loops
  - packages/velorki_api
  - packages/brouter_dart
