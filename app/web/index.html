<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Velorki plans bike routes, builds loops and records your rides on OpenStreetMap data. Free and open source.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-itunes-app" content="app-id=6816790504">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Velorki">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Velorki</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* The app draws its own attribution chip; the maplibre web plugin cannot
       move its button off screen as the phones do. */
    .maplibregl-ctrl-attrib { display: none !important; }
  </style>
</head>
<body>
  <!--
    device_gate.mjs shows phones and tablets the app download page instead,
    before the engine is fetched; everywhere else it appends
    flutter_bootstrap.js. See its header.
  -->
  <script type="module" src="boot.mjs"></script>
</body>
</html>
