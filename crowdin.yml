# Crowdin: what is translated, and where the translations land.
#
# Credentials come from the environment, never from this file:
#   CROWDIN_PROJECT_ID      the numeric project id
#   CROWDIN_PERSONAL_TOKEN  a personal access token
# .github/workflows/crowdin.yml passes both as repository secrets; locally,
# export them before running the CLI. The `_env` form is the only one the CLI
# accepts: `project_id: ${CROWDIN_PROJECT_ID}` fails validation, because the
# value is checked as a number before any substitution happens.
#
# English is the source language. Only the six `source` paths below are
# edited by hand; every `translation` path is written by Crowdin and arrives
# in a pull request on `l10n/crowdin`. See docs/LOCALISATION.md.
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

# Keep the repository layout inside Crowdin, so a file's place in the project
# is its place here.
preserve_hierarchy: true

files:
  # The Flutter app's strings. %two_letters_code% is the target language, so
  # German lands in app/lib/l10n/app_de.arb; `supportedLocales` is generated
  # from the ARB files present, so a merged file enables the language with no
  # code change. The pattern only ever resolves to a target language, and
  # English is the source, so app_en.arb is never written by Crowdin.
  - source: /app/lib/l10n/app_en.arb
    translation: /app/lib/l10n/app_%two_letters_code%.arb

  # The website's UI strings (next-intl). Same rule: messages/en.json is the
  # source and can never be a translation target.
  - source: /web/messages/en.json
    translation: /web/messages/%two_letters_code%.json

  # The website's Markdown content: the user guide and the legal pages. The
  # tree under content/en is mirrored per language — `**` carries the
  # sub-directories (docs/, legal/), %original_file_name% the file name.
  # The imprint is left out: it is one bilingual text (German and English
  # both, in every language's copy), not a translation, and Crowdin would line
  # up its two halves by position. A language without its own copy falls back
  # to the English page, which holds the German too.
  - source: /web/content/en/**/*.md
    translation: /web/content/%two_letters_code%/**/%original_file_name%
    ignore:
      - /web/content/en/legal/imprint.md

  # The App Store listing (fastlane metadata). en-US is the source; Crowdin
  # writes every other locale into its own folder beside it, named the way
  # App Store Connect expects. The source glob only reaches en-US, so
  # review_information/ (a sibling folder, not a locale) is never picked up
  # and is never translated.
  #
  # Crowdin's own locale format is `ll-CC` (%locale%), which already matches
  # Apple's folder names for most languages (de-DE, fr-FR, es-ES, nl-NL,
  # pt-BR...). Three of the first languages don't: Apple drops the country
  # for Italian (`it`, not `it-IT`) and Japanese (`ja`, not `ja-JP`), and
  # uses a script code for Chinese (`zh-Hans`, not `zh-CN`) — hence the
  # mapping below.
  - source: /app/fastlane/metadata/ios/en-US/*.txt
    translation: /app/fastlane/metadata/ios/%locale%/%original_file_name%
    languages_mapping:
      locale:
        it-IT: it
        ja-JP: ja
        zh-CN: zh-Hans

  # The Play Store listing (fastlane metadata). Same shape as the App Store
  # one above, but Play's folder names are `ll-CC` throughout (it-IT, ja-JP,
  # zh-CN...), which is exactly what %locale% already gives, so this one
  # needs no languages_mapping.
  - source: /app/fastlane/metadata/android/en-US/*.txt
    translation: /app/fastlane/metadata/android/%locale%/%original_file_name%

  # The App Store slides' copy: per slide an eyebrow, a headline (the
  # **phrase** in it is the accent colour) and a subline. See
  # docs/STORE_ASSETS.md.
  - source: /app/store/slides_en.json
    translation: /app/store/slides_%two_letters_code%.json
